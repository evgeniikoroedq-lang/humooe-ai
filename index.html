<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;
}


/* PREMIUM BACKGROUND */

body:before{

content:"";

position:fixed;
inset:-200px;

background:
radial-gradient(circle at 20% 20%,#444,transparent 30%),
radial-gradient(circle at 80% 70%,#222,transparent 30%);

filter:blur(80px);

animation:bg 15s infinite alternate;

z-index:-1;

}


@keyframes bg{

from{
transform:translate(0);
}

to{
transform:translate(60px,40px);
}

}



/* APP */

.app{

height:100vh;
display:flex;
flex-direction:column;

}



/* HEADER */

.header{

padding:25px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:28px;
font-weight:700;

}


.logo span{

color:#888;

}



.profile{

width:48px;
height:48px;

border-radius:50%;

background:#ffffff15;

border:1px solid #ffffff20;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

transition:.3s;

}


.profile:active{

transform:scale(.9);

}



/* HOME */

.home{

padding:25px;

animation:fade .5s;

}


@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;

}

}



h1{

font-size:40px;

line-height:1.1;

margin:0;

}


.subtitle{

color:#999;

font-size:18px;

margin-top:12px;

}



/* CARD */

.card{

margin-top:35px;

padding:25px;

border-radius:30px;

background:
rgba(255,255,255,.07);

border:
1px solid rgba(255,255,255,.15);

backdrop-filter:blur(25px);

}



.card h2{

margin-top:0;

}



.start{

width:100%;

height:55px;

border-radius:25px;

border:0;

background:white;

color:black;

font-size:18px;

font-weight:600;

margin-top:20px;

}



/* QUICK */

.quick{

display:flex;

gap:10px;

overflow:auto;

margin-top:25px;

}


.quick button{

padding:15px 20px;

border-radius:20px;

background:#ffffff10;

border:1px solid #ffffff20;

color:white;

}



/* CHAT */

.chat{

display:none;

flex:1;

overflow:auto;

padding:20px;

}



.message{

padding:16px;

border-radius:22px;

max-width:85%;

margin-bottom:15px;

animation:fade .3s;

}



.ai{

background:#ffffff12;

}



.user{

background:white;

color:black;

margin-left:auto;

}



/* INPUT */

.bottom{

display:none;

padding:15px;

gap:10px;

}



.input{

flex:1;

height:55px;

border-radius:30px;

background:#ffffff10;

border:1px solid #ffffff25;

color:white;

padding:0 20px;

outline:none;

}



.send{

width:55px;

height:55px;

border-radius:50%;

border:0;

background:white;

font-size:20px;

}

</style>

</head>


<body>


<div class="app">


<div class="header">


<div class="logo">

Humooe <span>AI</span>

</div>



<div class="profile" onclick="openProfile()">

👤

</div>


</div>





<div class="home" id="home">


<h1>

Добрый вечер 👋

</h1>



<div class="subtitle">

Ваш персональный AI-помощник

</div>




<div class="card" onclick="openChat()">


<h2>

Новый чат

</h2>


<p>

Начать разговор с Humooe AI

</p>



<button class="start">

Начать

</button>


</div>





<h3>

Быстрый доступ

</h3>



<div class="quick">


<button>
🧮 Задачи
</button>


<button>
📚 Учёба
</button>


<button>
✍️ Тексты
</button>


</div>


</div>





<div class="chat" id="chat">


<div class="message ai">

Привет 👋

<br><br>

Я Humooe AI.

</div>


</div>





<div class="bottom" id="bottom">


<input

class="input"

id="input"

placeholder="Напишите сообщение..."

>



<button

class="send"

onclick="sendMessage()"

>

➤

</button>


</div>





</div>







<!-- ПРОФИЛЬ -->


<div class="modal" id="profileModal">


<div class="window">


<h2>
Профиль
</h2>


<p id="userInfo">

Вы не вошли

</p>



<button onclick="showLogin()">

Войти

</button>



<button onclick="showRegister()">

Регистрация

</button>



<button onclick="logout()">

Выйти

</button>



<button onclick="closeProfile()">

Закрыть

</button>


</div>


</div>








<!-- АВТОРИЗАЦИЯ -->


<div class="modal" id="authModal">


<div class="window">


<h2 id="authTitle">

Регистрация

</h2>




<input

id="email"

placeholder="Email"

>



<input

id="password"

type="password"

placeholder="Пароль"

>



<button

onclick="authAction()"

id="authButton"

>

Создать аккаунт

</button>



<button onclick="closeAuth()">

Закрыть

</button>



</div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>


// =========================
// SUPABASE
// =========================


const SUPABASE_URL =
"https://reaajdispyhngnqdjsio.supabase.co";


const SUPABASE_KEY =
"sb_publishable_1UwuGu3Ni-BHNhfzmHTkVQ_iY_NPqMM";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// =========================
// CHAT
// =========================


function openChat(){

document
.getElementById("home")
.style.display="none";


document
.getElementById("chat")
.style.display="block";


document
.getElementById("bottom")
.style.display="flex";


loadHistory();

}




function addMessage(text,type){


let div =
document.createElement("div");


div.className =
"message " + type;


div.innerHTML = text;


document
.getElementById("chat")
.appendChild(div);


}




async function sendMessage(){


let input =
document.getElementById("input");


let text =
input.value.trim();


if(!text)return;



addMessage(text,"user");


input.value="";



// проверяем пользователя

const {

data:{
user

}

}= await supabaseClient.auth.getUser();



if(!user){

addMessage(
"Сначала войдите в аккаунт 👤",
"ai"
);

return;

}



// сохраняем сообщение


await supabaseClient
.from("chats")
.insert({

user_id:user.id,

message:text,

role:"user"

});




// временный ответ

let answer =
"🤖 Humooe AI получил сообщение. Скоро подключим настоящий AI.";



addMessage(
answer,
"ai"
);




// сохраняем ответ

await supabaseClient
.from("chats")
.insert({

user_id:user.id,

message:answer,

role:"ai"

});


}




// =========================
// HISTORY
// =========================



async function loadHistory(){


const {

data:{
user

}

}= await supabaseClient.auth.getUser();



if(!user)return;



let {

data,
error

}= await supabaseClient

.from("chats")

.select("*")

.eq(
"user_id",
user.id
)

.order(
"created_at",
{
ascending:true
}
);



if(error)return;



data.forEach(item=>{


addMessage(

item.message,

item.role

);


});


}





// =========================
// PROFILE
// =========================


function openProfile(){

document
.getElementById("profileModal")
.style.display="flex";


checkUser();

}



function closeProfile(){

document
.getElementById("profileModal")
.style.display="none";

}




// =========================
// AUTH
// =========================



let authMode="register";



function showLogin(){

authMode="login";


document
.getElementById("authTitle")
.innerHTML="Вход";


document
.getElementById("authButton")
.innerHTML="Войти";


closeProfile();


document
.getElementById("authModal")
.style.display="flex";

}




function showRegister(){

authMode="register";


document
.getElementById("authTitle")
.innerHTML="Регистрация";


document
.getElementById("authButton")
.innerHTML="Создать аккаунт";


closeProfile();


document
.getElementById("authModal")
.style.display="flex";

}




function closeAuth(){

document
.getElementById("authModal")
.style.display="none";

}




async function authAction(){



let email =
document
.getElementById("email")
.value;


let password =
document
.getElementById("password")
.value;



if(authMode==="register"){



let {

error

}= await supabaseClient.auth.signUp({

email,

password

});



if(error)

alert(error.message);

else

alert(
"Аккаунт создан!"
);



}

else {



let {

error

}= await supabaseClient.auth.signInWithPassword({

email,

password

});



if(error)

alert(error.message);

else

alert(
"Вы вошли!"
);



}



closeAuth();


}





async function checkUser(){


const {

data:{
user

}

}= await supabaseClient.auth.getUser();



let box =
document.getElementById("userInfo");



if(user){

box.innerHTML =
"Вы вошли:<br>" + user.email;

}

else{

box.innerHTML =
"Вы не вошли";

}



}




async function logout(){


await supabaseClient.auth.signOut();


alert(
"Вы вышли"
);


}




document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter")

sendMessage();

});



</script>


</body>

</html>
