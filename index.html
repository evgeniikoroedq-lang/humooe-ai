<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

body{
margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;
}


/* фон */

body:before{

content:"";

position:fixed;
inset:-200px;

background:
radial-gradient(circle at 20% 20%,#333,transparent 30%),
radial-gradient(circle at 80% 80%,#222,transparent 30%);

filter:blur(80px);

animation:bgmove 15s infinite alternate;

z-index:-1;

}


@keyframes bgmove{

from{
transform:translate(0,0);
}

to{
transform:translate(50px,40px);
}

}



/* приложение */

.app{

height:100vh;
display:flex;
flex-direction:column;

}


/* верх */

.header{

padding:25px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:25px;
font-weight:700;

letter-spacing:-1px;

}


.logo span{

color:#aaa;

}



.avatar{

width:45px;
height:45px;

border-radius:50%;

background:#ffffff15;

backdrop-filter:blur(20px);

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

transition:.3s;

}


.avatar:active{

transform:scale(.9);

}



/* главный экран */

.home{

padding:25px;

animation:show .7s;

}



@keyframes show{

from{

opacity:0;
transform:translateY(20px);

}

}



h1{

font-size:38px;

line-height:1.1;

}



.subtitle{

color:#aaa;

font-size:18px;

}



.card{

margin-top:25px;

padding:25px;

border-radius:25px;

background:#ffffff10;

border:1px solid #ffffff15;

backdrop-filter:blur(20px);

transition:.3s;

}



.card:active{

transform:scale(.97);

}



.start{

width:100%;

padding:18px;

border:0;

border-radius:20px;

background:white;

color:black;

font-size:18px;

font-weight:600;

}



/* быстрые кнопки */

.quick{

display:flex;

gap:10px;

margin-top:20px;

overflow:auto;

}


.quick button{

background:#ffffff10;

color:white;

border:1px solid #ffffff15;

padding:15px;

border-radius:18px;

white-space:nowrap;

}



/* чат */

.chat{

display:none;

flex:1;

padding:20px;

overflow:auto;

}



.message{

padding:15px;

border-radius:20px;

margin-bottom:12px;

animation:show .4s;

max-width:85%;

}



.ai{

background:#ffffff12;

}


.user{

margin-left:auto;

background:white;

color:black;

}



/* низ */

.bottom{

display:none;

padding:15px;

gap:10px;

}



.input{

flex:1;

background:#ffffff12;

border:1px solid #ffffff20;

border-radius:25px;

padding:15px;

color:white;

outline:none;

}



.send{

width:55px;

border-radius:50%;

border:0;

background:white;

}



/* профиль */

.modal{

position:fixed;

inset:0;

background:#000a;

display:none;

align-items:flex-end;

}


.sheet{

width:100%;

background:#111;

border-radius:30px 30px 0 0;

padding:30px;

animation:up .4s;

}



@keyframes up{

from{

transform:translateY(100%);

}

}



.sheet button{

width:100%;

padding:16px;

margin-top:10px;

border-radius:20px;

border:0;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="avatar" onclick="profile()">
👤
</div>

</div>



<div class="home" id="home">


<h1>
Добрый вечер 👋
</h1>


<p class="subtitle">
Ваш персональный AI-помощник
</p>



<div class="card" onclick="openChat()">

<h2>
Новый чат
</h2>

<p>
Начать разговор с Humooe AI
</p>


<button class="start">
Начать
</button>


</div>




<h3>
Быстрый доступ
</h3>


<div class="quick">

<button>
🧮 Задачи
</button>

<button>
📚 Учёба
</button>

<button>
✍️ Тексты
</button>


</div>


</div>




<div class="chat" id="chat">


<div class="message ai">

Привет 👋
Я Humooe AI.

</div>


</div>



<div class="bottom" id="bottom">


<input class="input" id="input" placeholder="Напишите...">


<button class="send" onclick="send()">
➤
</button>


</div>




</div>




<div class="modal" id="modal">


<div class="sheet">

<h2>
Профиль
</h2>


<button>
Войти
</button>


<button>
Регистрация
</button>


<button onclick="closeProfile()">
Закрыть
</button>


</div>


</div>




<script>


function openChat(){

document.getElementById("home").style.display="none";

document.getElementById("chat").style.display="block";

document.getElementById("bottom").style.display="flex";

}



function send(){

let input=document.getElementById("input");

if(!input.value)return;


let div=document.createElement("div");

div.className="message user";

div.innerHTML=input.value;


document
.getElementById("chat")
.appendChild(div);


input.value="";


setTimeout(()=>{


let ai=document.createElement("div");

ai.className="message ai";

ai.innerHTML=
"Humooe AI готов ответить 🚀";


document
.getElementById("chat")
.appendChild(ai);


},700);


}



function profile(){

document
.getElementById("modal")
.style.display="flex";

}



function closeProfile(){

document
.getElementById("modal")
.style.display="none";

}


</script>


</body>
</html>
