<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
inset:-200px;
background:
radial-gradient(circle at 20% 20%,#555,transparent 30%),
radial-gradient(circle at 80% 80%,#222,transparent 30%);
filter:blur(90px);
animation:bgmove 15s infinite alternate;
z-index:-1;
}

@keyframes bgmove{
from{transform:translate(0)}
to{transform:translate(50px,50px)}
}


.header{
height:90px;
padding:20px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
font-size:30px;
font-weight:800;
}

.logo span{
color:#888;
}


.profile{
width:50px;
height:50px;
border-radius:50%;
background:#ffffff15;
border:1px solid #ffffff25;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}

.profile:hover{
transform:scale(1.1);
}



.home{
padding:25px;
animation:fade .5s;
}


@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
}
}


h1{
font-size:42px;
margin:0;
}


.subtitle{
color:#999;
font-size:18px;
margin-top:10px;
}


.card{
margin-top:35px;
padding:25px;
border-radius:30px;
background:#ffffff10;
border:1px solid #ffffff20;
backdrop-filter:blur(20px);
}


.card button{
margin-top:20px;
}


button{
height:55px;
width:100%;
border:0;
border-radius:25px;
font-size:17px;
cursor:pointer;
background:white;
color:black;
}


.quick{
display:flex;
gap:10px;
margin-top:25px;
}


.quick button{
background:#ffffff10;
color:white;
border:1px solid #ffffff20;
}


.chat{
display:none;
flex:1;
overflow:auto;
padding:20px;
}


.message{
max-width:85%;
padding:15px;
border-radius:22px;
margin-bottom:15px;
animation:fade .3s;
}


.ai{
background:#ffffff12;
}


.user{
background:white;
color:black;
margin-left:auto;
}



.bottom{
display:none;
padding:15px;
gap:10px;
}


.input{
flex:1;
height:55px;
border-radius:30px;
background:#ffffff10;
border:1px solid #ffffff25;
color:white;
padding:0 20px;
font-size:16px;
}


.send{
width:55px;
height:55px;
border-radius:50%;
}



.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:flex-end;
z-index:10;
}


.window{
width:100%;
background:#111;
padding:30px;
border-radius:35px 35px 0 0;
animation:up .3s;
}


@keyframes up{
from{
transform:translateY(100%);
}
}



.window input{
width:100%;
height:55px;
margin-top:12px;
border-radius:20px;
background:#050505;
border:1px solid #333;
color:white;
padding:15px;
}


.window button{
margin-top:12px;
}


</style>

</head>

<body>


<div class="header">


<div class="logo">
Humooe <span>AI</span>
</div>


<div class="profile" onclick="openProfile()">
👤
</div>


</div>




<div class="home" id="home">


<h1>
Добрый вечер 👋
</h1>


<div class="subtitle">
Ваш персональный AI помощник
</div>



<div class="card">


<h2>
Новый чат
</h2>


<p>
Общайтесь с Humooe AI
</p>


<button onclick="openChat()">
Начать чат
</button>


</div>


<div class="quick">

<button>
🧮 Задачи
</button>

<button>
📚 Учёба
</button>

<button>
✍️ Тексты
</button>

</div>


</div>





<div class="chat" id="chat">


<div class="message ai">
Привет 👋<br><br>
Я Humooe AI.
</div>


</div>





<div class="bottom" id="bottom">


<input
id="input"
class="input"
placeholder="Напишите сообщение..."
>


<button class="send" onclick="sendMessage()">
➤
</button>


</div>







<!-- PROFILE -->


<div class="modal" id="profileModal">


<div class="window">


<h2>
Аккаунт
</h2>


<p id="userInfo">
Проверка...
</p>


<button onclick="showLogin()">
Войти
</button>


<button onclick="showRegister()">
Регистрация
</button>


<button id="logoutBtn" onclick="logout()" style="display:none">
Выйти
</button>


<button onclick="closeProfile()">
Закрыть
</button>


</div>

</div>








<!-- AUTH -->


<div class="modal" id="authModal">


<div class="window">


<h2 id="authTitle">
Регистрация
</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Пароль">


<button id="authButton" onclick="authAction()">
Создать аккаунт
</button>


<button onclick="closeAuth()">
Закрыть
</button>


</div>

</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://reaajdispyhngnqdjsio.supabase.co";


// ВСТАВЬ СЮДА СВОЙ SB_PUBLISHABLE КЛЮЧ

const SUPABASE_KEY =
"sb_publishable_1UwuGu3Ni-BHNhfzmHTkVQ_iY_NPqMM";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





let mode="register";




// CHAT


function openChat(){

document.getElementById("home").style.display="none";

document.getElementById("chat").style.display="block";

document.getElementById("bottom").style.display="flex";

loadHistory();

}




function addMessage(text,type){

let div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

document.getElementById("chat").appendChild(div);

}





async function sendMessage(){


let input=document.getElementById("input");

let text=input.value.trim();


if(!text)return;


addMessage(text,"user");


input.value="";



let {

data:{
user

}

}=await supabaseClient.auth.getUser();



if(user){


await supabaseClient
.from("chats")
.insert({

user_id:user.id,

message:text,

role:"user"

});


}



let answer=
"🤖 Humooe AI получил сообщение.";


addMessage(answer,"ai");



if(user){


await supabaseClient
.from("chats")
.insert({

user_id:user.id,

message:answer,

role:"ai"

});


}


}






async function loadHistory(){


let {

data:{
user

}

}=await supabaseClient.auth.getUser();



if(!user)return;



let {

data

}=await supabaseClient
.from("chats")
.select("*")
.eq("user_id",user.id)
.order("created_at");



if(data){

data.forEach(x=>{

addMessage(
x.message,
x.role
);

});

}


}







// PROFILE


function openProfile(){

document.getElementById("profileModal").style.display="flex";

checkUser();

}



function closeProfile(){

document.getElementById("profileModal").style.display="none";

}







// AUTH



function showLogin(){

mode="login";

authTitle.innerHTML="Вход";

authButton.innerHTML="Войти";

closeProfile();

authModal.style.display="flex";

}



function showRegister(){

mode="register";

authTitle.innerHTML="Регистрация";

authButton.innerHTML="Создать аккаунт";

closeProfile();

authModal.style.display="flex";

}



function closeAuth(){

authModal.style.display="none";

}





async function authAction(){


let emailValue=email.value;

let passValue=password.value;



if(mode==="register"){


let {error}=await supabaseClient.auth.signUp({

email:emailValue,

password:passValue

});


if(error)

alert(error.message);

else

alert("Аккаунт создан. Проверьте Email.");


}



else{


let {error}=await supabaseClient.auth.signInWithPassword({

email:emailValue,

password:passValue

});


if(error)

alert(error.message);

else

alert("Вы вошли!");

}



closeAuth();

}




async function checkUser(){


let {

data:{
user

}

}=await supabaseClient.auth.getUser();



if(user){

userInfo.innerHTML=user.email;

logoutBtn.style.display="block";


}else{


userInfo.innerHTML="Вы не вошли";

logoutBtn.style.display="none";


}


}





async function logout(){

await supabaseClient.auth.signOut();

checkUser();

alert("Вы вышли");

}




</script>


</body>

</html>
