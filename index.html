<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    font-family:Inter,Arial,sans-serif;
    background:#050510;
    color:white;
    overflow:hidden;
}


/* ===== ЖИВОЙ ФОН ===== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}


.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.7;
    animation:float 14s infinite alternate ease-in-out;
}


.orb.one{
    width:350px;
    height:350px;
    background:#7c3aed;
    top:-120px;
    left:-100px;
}


.orb.two{
    width:420px;
    height:420px;
    background:#2563eb;
    right:-150px;
    bottom:-150px;
    animation-delay:3s;
}


.orb.three{
    width:250px;
    height:250px;
    background:#c026d3;
    top:45%;
    left:35%;
    animation-delay:6s;
}



@keyframes float{

0%{
transform:translate(0,0) scale(1);
}

100%{
transform:translate(80px,60px) scale(1.15);
}

}



/* ===== APP ===== */

.app{

height:100vh;
display:flex;
flex-direction:column;

}



/* ===== HEADER ===== */


.header{

padding:20px;
display:flex;
align-items:center;
justify-content:space-between;

}



.logo{

font-size:28px;
font-weight:800;
letter-spacing:1px;

animation:appear 1s ease;

}


.logo span{

color:#8b5cf6;

}



.profile{

width:46px;
height:46px;
border-radius:50%;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(20px);

display:flex;
align-items:center;
justify-content:center;

animation:pulse 3s infinite;

}



/* ===== AI CORE ===== */


.core{

display:flex;
justify-content:center;
align-items:center;

margin-top:20px;

}


.ai-circle{

width:130px;
height:130px;

border-radius:50%;

background:
linear-gradient(
135deg,
#8b5cf6,
#2563eb
);

display:flex;
align-items:center;
justify-content:center;

font-size:45px;

box-shadow:
0 0 40px #8b5cf6;

animation:
pulse 3s infinite,
rotate 10s linear infinite;

}



@keyframes pulse{

0%,100%{

transform:scale(1);

box-shadow:
0 0 25px #8b5cf6;

}


50%{

transform:scale(1.08);

box-shadow:
0 0 60px #2563eb;

}

}



@keyframes rotate{

from{

filter:hue-rotate(0deg);

}

to{

filter:hue-rotate(360deg);

}

}



/* ===== CHAT ===== */


.chat{

flex:1;

padding:20px;

overflow-y:auto;

}



.message{

max-width:85%;

padding:15px 18px;

margin-bottom:15px;

border-radius:22px;

backdrop-filter:blur(20px);

animation:
messageIn .5s ease;

}



.ai{

background:
rgba(255,255,255,.1);

border:
1px solid rgba(255,255,255,.15);

}



.user{

margin-left:auto;

background:
linear-gradient(
135deg,
#7c3aed,
#2563eb
);

}



@keyframes messageIn{

from{

opacity:0;

transform:
translateY(30px);

}


to{

opacity:1;

transform:none;

}

}



/* ===== QUICK BUTTONS ===== */


.quick{

display:flex;

gap:10px;

padding:10px 20px;

overflow-x:auto;

}



.quick button{

border:none;

color:white;

padding:12px 18px;

border-radius:30px;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(20px);

transition:.3s;

}



.quick button:active{

transform:scale(.9);

box-shadow:
0 0 25px #8b5cf6;

}



/* ===== INPUT ===== */


.bottom{

padding:15px;

display:flex;

gap:10px;

}



.input{

flex:1;

height:55px;

border-radius:30px;

border:1px solid rgba(255,255,255,.15);

background:
rgba(255,255,255,.1);

backdrop-filter:blur(20px);

padding:0 20px;

color:white;

font-size:16px;

outline:none;

}



.input:focus{

box-shadow:
0 0 30px #7c3aed;

}



.send{

width:55px;

height:55px;

border-radius:50%;

border:none;

background:
linear-gradient(
135deg,
#8b5cf6,
#2563eb
);

color:white;

font-size:22px;

animation:pulse 3s infinite;

}



/* ===== LOAD ===== */


@keyframes appear{

from{

opacity:0;

transform:translateY(-20px);

}

to{

opacity:1;

transform:none;

}

}



</style>

</head>


<body>


<div class="background">

<div class="orb one"></div>

<div class="orb two"></div>

<div class="orb three"></div>

</div>



<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="profile">
👤
</div>


</div>



<div class="core">

<div class="ai-circle">

✦

</div>

</div>



<div class="chat">


<div class="message ai">

👋 Привет! Я Humooe AI.<br><br>

Готов помочь решить задачи,
объяснить тему или создать текст.

</div>


</div>



<div class="quick">

<button>🧮 Задачи</button>
<button>📚 Учёба</button>
<button>✍️ Тексты</button>
<button>💡 Идеи</button>


</div>



<div class="bottom">

<input class="input"
placeholder="Напишите вопрос...">


<button class="send">

➤

</button>


</div>



</div>

<script>

const input = document.querySelector(".input");
const send = document.querySelector(".send");
const chat = document.querySelector(".chat");


function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}



async function sendMessage(){

const text=input.value.trim();

if(!text) return;


addMessage(text,"user");

input.value="";



// анимация ожидания

const loading=document.createElement("div");

loading.className="message ai";

loading.id="loading";

loading.innerHTML="Humooe AI думает<span>.</span><span>.</span><span>.</span>";

chat.appendChild(loading);

chat.scrollTop=chat.scrollHeight;



try{


/*
Здесь позже подключим твой Cloudflare Worker
*/


setTimeout(()=>{


document.getElementById("loading")?.remove();


addMessage(
"Я получил ваш вопрос. Подключение AI будет добавлено следующим шагом 🚀",
"ai"
);


},1200);



}catch(e){


document.getElementById("loading")?.remove();

addMessage(
"Ошибка соединения",
"ai"
);


}


}



send.addEventListener(
"click",
sendMessage
);



input.addEventListener(
"keydown",
(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});



// быстрые кнопки

document.querySelectorAll(".quick button")
.forEach(btn=>{


btn.onclick=()=>{

input.value=btn.innerText;

sendMessage();

};


});


</script>
</body>
</html>
