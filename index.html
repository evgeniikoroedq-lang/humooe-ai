<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>


<style>


*{
box-sizing:border-box;
font-family:
Inter,
system-ui,
Arial,
sans-serif;
}


body{

margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;

}



body::before{

content:"";
position:fixed;
width:450px;
height:450px;

background:
radial-gradient(circle,#7c3aed,transparent 70%);

top:-150px;
right:-150px;

filter:blur(80px);

animation:move 8s infinite alternate;

}


@keyframes move{

from{
transform:translate(0);
}

to{
transform:translate(-80px,120px);
}

}




.app{

height:100vh;
display:flex;
flex-direction:column;

}




header{

height:80px;

display:flex;
align-items:center;
justify-content:space-between;

padding:20px;

}



.logo{

font-size:28px;
font-weight:900;

}



.logo span{

color:#8b5cf6;

}




.account{

width:45px;
height:45px;

border-radius:50%;

background:#ffffff15;

border:1px solid #ffffff20;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

}




main{

flex:1;

overflow:auto;

padding:20px;

}



.screen{

display:none;

animation:show .4s;

}



.screen.active{

display:block;

}



@keyframes show{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;

}

}





.hero h1{

font-size:42px;

line-height:1.1;

margin-top:40px;

}



.hero p{

color:#999;

font-size:18px;

}





.core{

width:150px;

height:150px;

border-radius:50%;

margin:40px auto;


background:

radial-gradient(circle,
#fff,
#8b5cf6,
#111);


display:flex;

align-items:center;

justify-content:center;


font-size:45px;


animation:pulse 3s infinite;


}



@keyframes pulse{

0%,100%{

transform:scale(1);

box-shadow:0 0 20px #8b5cf6;

}


50%{

transform:scale(1.08);

box-shadow:0 0 80px #8b5cf6;

}

}





.card{

background:#ffffff10;

border:1px solid #ffffff20;

backdrop-filter:blur(20px);

border-radius:30px;

padding:25px;

margin-bottom:20px;

}



button{

height:55px;

border:none;

border-radius:30px;

width:100%;

font-size:16px;

cursor:pointer;

}



.primary{

background:white;

color:black;

}





.chat-box{

height:calc(100vh - 230px);

overflow:auto;

}



.message{

max-width:85%;

padding:15px;

border-radius:22px;

margin-bottom:15px;

animation:show .3s;

}



.ai{

background:#ffffff12;

}



.user{

background:white;

color:black;

margin-left:auto;

}



.copy{

margin-top:10px;

background:#ffffff15;

color:white;

border:1px solid #ffffff20;

height:35px;

width:auto;

padding:0 15px;

}




.input-area{

display:flex;

gap:10px;

}



.input-area input{

flex:1;

height:55px;

border-radius:30px;

border:1px solid #ffffff20;

background:#ffffff10;

color:white;

padding:0 20px;

font-size:16px;

}



.send{

width:55px;

}





nav{

height:75px;

display:flex;

justify-content:space-around;

align-items:center;

background:#0b0b0bee;

border-top:1px solid #ffffff15;

}



.nav-item{

color:#888;

text-align:center;

cursor:pointer;

font-size:13px;

}



.nav-item b{

display:block;

font-size:23px;

}



.active-nav{

color:white;

}



</style>


</head>


<body>



<div class="app">



<header>

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="account" onclick="openProfile()">
👤
</div>


</header>





<main>



<section class="screen active" id="home">


<div class="hero">


<h1>
Ваш AI<br>
помощник
</h1>


<p>
Создавайте идеи, решайте задачи и общайтесь.
</p>



<div class="core">
✦
</div>




<div class="card">


<h2>
Начать работу
</h2>


<p>
Откройте новый разговор с Humooe AI.
</p>


<button class="primary"
onclick="openChat()">

Начать чат

</button>


</div>


</div>


</section>







<section class="screen" id="chat">


<div class="chat-box" id="messages">


<div class="message ai">

Привет 👋<br>
Я Humooe AI.

</div>


</div>



<div class="input-area">


<input
id="input"
placeholder="Сообщение..."
>


<button class="send primary"
onclick="sendMessage()">

➤

</button>


</div>


</section>







<section class="screen" id="profile">


<div class="card">


<h2>
Профиль
</h2>


<p id="userText">
Вы не вошли
</p>


<button class="primary"
onclick="openLogin()">

Войти

</button>


<button class="primary"
onclick="openRegister()">

Регистрация

</button>


</div>


</section>




</main>




<nav>


<div class="nav-item active-nav"
onclick="showScreen('home')">

<b>🏠</b>
Главная

</div>


<div class="nav-item"
onclick="openChat()">

<b>💬</b>
Чат

</div>


<div class="nav-item"
onclick="showScreen('profile')">

<b>👤</b>
Профиль

</div>


</nav>




</div>

<!-- ОКНА АККАУНТА -->


<div id="authModal" class="modal">


<div class="window">


<h2 id="authTitle">
Вход
</h2>


<input id="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Пароль">



<button class="primary"
onclick="authAction()"
id="authButton">

Войти

</button>



<button onclick="closeAuth()">

Закрыть

</button>


</div>


</div>





<style>


.modal{

position:fixed;

inset:0;

background:#000b;

display:none;

align-items:flex-end;

z-index:50;

}



.window{

width:100%;

background:#111;

padding:30px;

border-radius:35px 35px 0 0;

animation:up .3s;

}



.window input{

width:100%;

height:55px;

margin:10px 0;

border-radius:25px;

background:#050505;

border:1px solid #333;

color:white;

padding:0 20px;

font-size:16px;

}



@keyframes up{

from{

transform:translateY(100%);

}

to{

transform:none;

}

}



</style>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// =====================
// SUPABASE
// =====================



const SUPABASE_URL =

"https://reaajdispyhngnqdjsio.supabase.co";



const SUPABASE_KEY =

"sb_publishable_1UwuGu3Ni-BHNhfzmHTkVQ_iY_NPqMM";





const supabaseClient =

supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);





let mode="login";







// =====================
// ЭКРАНЫ
// =====================



function showScreen(id){


document
.querySelectorAll(".screen")
.forEach(x=>{

x.classList.remove("active");

});



document
.getElementById(id)
.classList.add("active");


}






function openChat(){

showScreen("chat");

loadHistory();

}





// =====================
// АККАУНТ
// =====================



function openLogin(){


mode="login";


authTitle.innerHTML="Вход";


authButton.innerHTML="Войти";


authModal.style.display="flex";


}





function openRegister(){


mode="register";


authTitle.innerHTML="Регистрация";


authButton.innerHTML="Создать аккаунт";


authModal.style.display="flex";


}



function closeAuth(){

authModal.style.display="none";

}





async function authAction(){


let mail=email.value;

let pass=password.value;



if(mode==="register"){



let {

error

}=await supabaseClient.auth.signUp({

email:mail,

password:pass

});



if(error)

alert(error.message);


else

alert("Аккаунт создан");



}





else{


let {

error

}=await supabaseClient.auth.signInWithPassword({

email:mail,

password:pass

});



if(error)

alert(error.message);


else

alert("Вход выполнен");


}




closeAuth();

checkUser();


}





async function checkUser(){



let {

data:{user}

}=await supabaseClient.auth.getUser();



if(user){


userText.innerHTML=

"👤 "+user.email;



}else{


userText.innerHTML=

"Вы не вошли";


}



}





async function openProfile(){


showScreen("profile");

checkUser();


}







// =====================
// ЧАТ
// =====================




function addMessage(text,type){


let div=document.createElement("div");


div.className="message "+type;



div.innerHTML=text;



if(type==="ai"){


let btn=document.createElement("button");


btn.className="copy";


btn.innerHTML="📋 Копировать";


btn.onclick=()=>{


navigator.clipboard.writeText(text);


alert("Скопировано");


};



div.appendChild(btn);



}



messages.appendChild(div);


messages.scrollTop=
messages.scrollHeight;


}





async function sendMessage(){



let text=input.value.trim();



if(!text)return;



addMessage(text,"user");


input.value="";




// ТУТ ПОТОМ ПОДКЛЮЧИМ НАСТОЯЩИЙ AI


setTimeout(()=>{


addMessage(

"🤖 Humooe AI получил запрос:<br><br>"+text,

"ai"


);


},700);




}





// =====================
// ИСТОРИЯ
// =====================



async function loadHistory(){



let {

data:{user}

}=await supabaseClient.auth.getUser();



if(!user)return;



let {

data

}=await supabaseClient

.from("chats")

.select("*")

.eq("user_id",user.id)

.order("created_at");




if(data){


data.forEach(item=>{


addMessage(

item.message,

item.role

);


});


}



}





checkUser();


</script>


</body>

</html>
