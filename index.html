<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
margin:0;
height:100vh;
overflow:hidden;
background:#050510;
color:white
}


/* фон */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden
}

.ball{
position:absolute;
border-radius:50%;
filter:blur(80px);
animation:move 12s infinite alternate
}

.b1{
width:350px;
height:350px;
background:#7c3aed;
top:-100px;
left:-100px
}

.b2{
width:400px;
height:400px;
background:#2563eb;
right:-120px;
bottom:-120px;
animation-delay:3s
}

.b3{
width:250px;
height:250px;
background:#d946ef;
top:40%;
left:40%;
animation-delay:5s
}

@keyframes move{
from{transform:translate(0)}
to{transform:translate(80px,60px)}
}



/* приложение */

.app{
height:100vh;
display:flex;
flex-direction:column
}


.header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center
}


.logo{
font-size:27px;
font-weight:900
}

.logo span{
color:#8b5cf6
}


.profile{
width:45px;
height:45px;
border-radius:50%;
background:#ffffff20;
backdrop-filter:blur(20px);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:5;
animation:pulse 3s infinite
}


@keyframes pulse{

50%{
box-shadow:0 0 35px #8b5cf6;
transform:scale(1.08)
}

}



/* AI */

.core{
display:flex;
justify-content:center
}


.ai{
width:120px;
height:120px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#2563eb);
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
box-shadow:0 0 50px #7c3aed;
animation:pulse 3s infinite
}



/* чат */


.chat{
flex:1;
overflow:auto;
padding:20px
}


.msg{
max-width:85%;
padding:15px;
border-radius:22px;
margin-bottom:15px;
animation:show .4s;
}


@keyframes show{
from{
opacity:0;
transform:translateY(20px)
}
}


.ai-msg{
background:#ffffff18;
backdrop-filter:blur(20px)
}


.user-msg{
margin-left:auto;
background:linear-gradient(135deg,#7c3aed,#2563eb)
}



/* кнопки */


.quick{
display:flex;
gap:10px;
padding:10px;
overflow:auto
}


.quick button{

border:0;
padding:12px 18px;
border-radius:30px;
background:#ffffff20;
color:white;
white-space:nowrap
}



/* ввод */


.bottom{
display:flex;
gap:10px;
padding:15px
}


input{

flex:1;
height:55px;
border-radius:30px;
border:1px solid #ffffff30;
background:#ffffff15;
color:white;
padding:0 20px;
font-size:16px;
outline:none

}


.send{

width:55px;
height:55px;
border-radius:50%;
border:0;
background:linear-gradient(135deg,#8b5cf6,#2563eb);
color:white;
font-size:22px;
cursor:pointer

}



/* окно профиля */


.modal{

position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:#0008;

}


.box{

width:90%;
max-width:350px;
padding:25px;
border-radius:25px;
background:#111827;
box-shadow:0 0 40px #8b5cf6

}


.box button{

width:100%;
margin-top:10px;
padding:14px;
border:0;
border-radius:20px;
background:#8b5cf6;
color:white

}


</style>
</head>


<body>


<div class="bg">
<div class="ball b1"></div>
<div class="ball b2"></div>
<div class="ball b3"></div>
</div>


<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="profile" onclick="openProfile()">
👤
</div>

</div>


<div class="core">
<div class="ai">✦</div>
</div>



<div class="chat" id="chat">

<div class="msg ai-msg">

👋 Привет! Я Humooe AI.

<br><br>

Задай мне любой вопрос.

</div>

</div>



<div class="quick">

<button onclick="quick('Реши задачу')">🧮 Задача</button>
<button onclick="quick('Объясни тему')">📚 Учёба</button>
<button onclick="quick('Напиши текст')">✍️ Текст</button>
<button onclick="quick('Придумай идеи')">💡 Идеи</button>

</div>



<div class="bottom">

<input id="input" placeholder="Напишите вопрос...">

<button class="send" onclick="send()">
➤
</button>

</div>



</div>




<div class="modal" id="modal">


<div class="box">

<h2>👤 Профиль</h2>

<p>
Вход и регистрация Humooe AI
</p>


<button>
Войти
</button>


<button>
Регистрация
</button>


<button onclick="closeProfile()">
Закрыть
</button>


</div>


</div>




<script>


// сюда потом вставим Worker

const AI_API="";



function add(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text;

document
.getElementById("chat")
.appendChild(div);


}



function send(){

let input=document.getElementById("input");

let text=input.value.trim();

if(!text)return;


add(text,"user-msg");

input.value="";


setTimeout(()=>{

add(
"🤖 Humooe AI получил вопрос. Подключение нейросети добавим следующим шагом.",
"ai-msg"
);

},800);


}




document
.getElementById("input")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
send();

});



function quick(t){

document.getElementById("input").value=t;

send();

}



function openProfile(){

document
.getElementById("modal")
.style.display="flex";

}



function closeProfile(){

document
.getElementById("modal")
.style.display="none";

}



</script>


</body>
</html>
