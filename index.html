<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Humooe AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:#07090d;
color:#fff;
}

button,textarea{font:inherit}

.app{
height:100vh;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:280px;
background:#0d1016;
border-right:1px solid #242a34;
padding:18px;
display:flex;
flex-direction:column;
z-index:20;
}

.brand{
display:flex;
align-items:center;
gap:12px;
margin-bottom:22px;
}

.logo{
width:43px;
height:43px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:21px;
color:#111;
background:linear-gradient(135deg,#fff,#777);
box-shadow:0 0 30px #fff2;
}

.brandName{
font-size:20px;
font-weight:800;
}

.newChat{
width:100%;
padding:13px;
border:0;
border-radius:14px;
background:#fff;
color:#111;
font-weight:700;
}

.section{
font-size:11px;
color:#687181;
margin:25px 5px 8px;
text-transform:uppercase;
}

.history{
flex:1;
overflow:auto;
}

.historyItem{
padding:12px;
border-radius:12px;
margin-bottom:4px;
color:#b8c0cc;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
cursor:pointer;
}

.historyItem:hover{
background:#1b2029;
color:#fff;
}

.bottom{
display:flex;
gap:8px;
}

.bottom button{
flex:1;
padding:10px;
border:1px solid #2b313c;
border-radius:11px;
background:#171b23;
color:#ddd;
}

/* MAIN */

.main{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
position:relative;
}

.topbar{
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:#0b0e14dd;
border-bottom:1px solid #242a34;
}

.title{
font-size:18px;
font-weight:800;
}

.menu{
display:none;
border:0;
background:none;
color:white;
font-size:25px;
}

/* CHAT */

.chat{
flex:1;
overflow:auto;
padding:35px 20px 150px;
scroll-behavior:smooth;
}

.welcome{
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.orb{
width:105px;
height:105px;
border-radius:50%;
background:
radial-gradient(circle at 30% 25%,#fff 0,#ddd 20%,#777 48%,#222 78%,#000 100%);
box-shadow:0 0 30px #fff3,0 0 100px #fff1;
animation:float 3s ease-in-out infinite;
position:relative;
}

.orb:after{
content:"";
position:absolute;
inset:-14px;
border:1px solid #fff3;
border-radius:50%;
animation:ring 3s linear infinite;
}

@keyframes float{
0%,100%{transform:translateY(0) scale(1)}
50%{transform:translateY(-9px) scale(1.06)}
}

@keyframes ring{
0%{transform:scale(.9);opacity:.2}
50%{transform:scale(1.12);opacity:.8}
100%{transform:scale(.9);opacity:.2}
}

.welcome h1{
font-size:46px;
margin:28px 0 8px;
background:linear-gradient(90deg,#fff,#8f99aa,#fff);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:shine 4s linear infinite;
}

@keyframes shine{
to{background-position:200%}
}

.welcome p{
color:#8c95a5;
}

.messages{
max-width:900px;
margin:auto;
}

.message{
display:flex;
margin:18px 0;
animation:appear .25s ease;
}

@keyframes appear{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:none}
}

.message.user{
justify-content:flex-end;
}

.bubble{
max-width:min(78%,760px);
padding:14px 17px;
border-radius:18px;
line-height:1.55;
font-size:15px;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.user .bubble{
background:#252b36;
border:1px solid #303745;
}

.assistant .bubble{
background:#12161e;
border:1px solid #222936;
}

.actions{
margin-top:7px;
}

.copy{
background:none;
border:0;
color:#727c8d;
font-size:12px;
}

.copy:hover{
color:white;
}

/* TYPING */

.dots{
display:flex;
gap:5px;
}

.dots span{
width:7px;
height:7px;
border-radius:50%;
background:#aaa;
animation:dot 1s infinite;
}

.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}

@keyframes dot{
0%,70%,100%{opacity:.2;transform:translateY(0)}
35%{opacity:1;transform:translateY(-4px)}
}

/* INPUT */

.inputWrap{
position:absolute;
bottom:0;
left:0;
right:0;
padding:18px 20px 20px;
background:linear-gradient(transparent,#07090d 35%);
}

.inputBox{
max-width:900px;
margin:auto;
display:flex;
align-items:flex-end;
padding:9px;
border:1px solid #303744;
background:#141821;
border-radius:20px;
box-shadow:0 15px 50px #0007;
}

textarea{
flex:1;
min-height:44px;
max-height:160px;
resize:none;
padding:11px;
border:0;
outline:0;
background:none;
color:white;
line-height:1.45;
}

textarea::placeholder{
color:#6e7787;
}

.attach,
.send{
width:44px;
height:44px;
border-radius:14px;
border:0;
}

.attach{
background:none;
color:#8c95a5;
font-size:21px;
}

.attach:hover{
background:#202631;
color:#fff;
}

.send{
background:#fff;
color:#111;
font-size:20px;
font-weight:900;
}

.send:hover{
transform:scale(1.05);
}

.file{
max-width:900px;
margin:0 auto 8px;
padding:9px 12px;
border-radius:12px;
background:#151a23;
border:1px solid #2c3340;
color:#aeb6c4;
font-size:13px;
display:none;
}

.file.show{
display:block;
}

/* MOBILE */

.overlay{
display:none;
}

@media(max-width:750px){

.sidebar{
position:fixed;
top:0;
bottom:0;
left:-290px;
transition:.25s;
box-shadow:20px 0 50px #0008;
}

.sidebar.open{
left:0;
}

.overlay.show{
display:block;
position:fixed;
inset:0;
background:#0008;
z-index:15;
}

.menu{
display:block;
}

.topbar{
padding:0 15px;
}

.chat{
padding:20px 12px 145px;
}

.welcome h1{
font-size:36px;
}

.orb{
width:85px;
height:85px;
}

.bubble{
max-width:90%;
font-size:14px;
}

.inputWrap{
padding:10px;
}

.inputBox{
border-radius:17px;
}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<div class="logo">H</div>
<div class="brandName">Humooe AI</div>
</div>

<button class="newChat" onclick="newChat()">＋ Новый чат</button>

<div class="section">История</div>

<div class="history" id="history"></div>

<div class="bottom">
<button onclick="toggleTheme()">◐ Тема</button>
<button onclick="clearHistory()">Очистить</button>
</div>

</aside>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<main class="main">

<header class="topbar">

<button class="menu" onclick="toggleMenu()">☰</button>

<div class="title">Humooe AI</div>

<div></div>

</header>

<section class="chat" id="chat"></section>

<div class="inputWrap">

<div class="file" id="filePreview"></div>

<div class="inputBox">

<button class="attach" onclick="document.getElementById('file').click()">＋</button>

<input
id="file"
type="file"
hidden
onchange="handleFile(this)"
>

<textarea
id="input"
rows="1"
placeholder="Напишите сообщение..."
></textarea>

<button class="send" onclick="send()">↑</button>

</div>

</div>

</main>

</div>

<script>

/* HUMOOE WORKER */

const API="https://hummoe-ai.evgeniikoroedq.workers.dev";

/*
Каждый браузер получает собственное хранилище.
История НЕ отправляется другим пользователям.
*/

const STORAGE="humooe_private_chats_v2";
const THEME="humooe_theme_v2";

let messages=[];
let currentChat=-1;

let chats=[];

try{
chats=JSON.parse(localStorage.getItem(STORAGE)||"[]");
if(!Array.isArray(chats)) chats=[];
}catch{
chats=[];
}

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const history=document.getElementById("history");
const filePreview=document.getElementById("filePreview");

function save(){

localStorage.setItem(
STORAGE,
JSON.stringify(chats)
);

}

function welcome(){

chat.innerHTML=`

<div class="welcome">

<div class="orb"></div>

<h1>Humooe AI</h1>

<p>Ваш умный AI-помощник</p>

</div>

`;

}

function renderHistory(){

history.innerHTML="";

chats.forEach((item,index)=>{

const el=document.createElement("div");

el.className="historyItem";

el.textContent=item.title||"Новый чат";

el.onclick=()=>loadChat(index);

history.appendChild(el);

});

}

function loadChat(index){

currentChat=index;

messages=[...(chats[index].messages||[])];

renderMessages();

closeMenu();

}

function newChat(){

currentChat=-1;

messages=[];

welcome();

closeMenu();

input.focus();

}

function clearHistory(){

if(!confirm("Удалить всю историю этого браузера?")) return;

chats=[];

messages=[];

currentChat=-1;

save();

renderHistory();

welcome();

}

function toggleTheme(){

document.body.classList.toggle("light");

localStorage.setItem(
THEME,
document.body.classList.contains("light")
?"light"
:"dark"
);

}

function toggleMenu(){

document.getElementById("sidebar")
.classList.toggle("open");

document.getElementById("overlay")
.classList.toggle("show");

}

function closeMenu(){

document.getElementById("sidebar")
.classList.remove("open");

document.getElementById("overlay")
.classList.remove("show");

}

function renderMessages(){

chat.innerHTML=`
<div class="messages" id="messages"></div>
`;

const box=document.getElementById("messages");

messages.forEach(message=>{

addMessage(
message.role,
message.content,
box
);

});

chat.scrollTop=chat.scrollHeight;

}

function addMessage(role,text,parent){

const row=document.createElement("div");

row.className="message "+role;

const content=document.createElement("div");

const bubble=document.createElement("div");

bubble.className="bubble";

bubble.textContent=text;

content.appendChild(bubble);

if(role==="assistant"){

const actions=document.createElement("div");

actions.className="actions";

const copy=document.createElement("button");

copy.className="copy";

copy.textContent="Копировать";

copy.onclick=async()=>{

try{

await navigator.clipboard.writeText(text);

copy.textContent="Скопировано ✓";

setTimeout(()=>{
copy.textContent="Копировать";
},1200);

}catch{}

};

actions.appendChild(copy);

content.appendChild(actions);

}

row.appendChild(content);

parent.appendChild(row);

}

function typing(){

const box=document.getElementById("messages");

if(!box)return;

const row=document.createElement("div");

row.className="message assistant";

row.id="typing";

const bubble=document.createElement("div");

bubble.className="bubble";

bubble.innerHTML=`
<div class="dots">
<span></span>
<span></span>
<span></span>
</div>
`;

row.appendChild(bubble);

box.appendChild(row);

chat.scrollTop=chat.scrollHeight;

}

async function send(){

const text=input.value.trim();

if(!text)return;

if(!messages.length){

chat.innerHTML=`
<div class="messages" id="messages"></div>
`;

}

messages.push({
role:"user",
content:text
});

addMessage(
"user",
text,
document.getElementById("messages")
);

input.value="";

input.style.height="auto";

typing();

try{

const response=await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:messages.slice(-20)
})

});

if(!response.ok){

throw new Error("HTTP "+response.status);

}

const data=await response.json();

document.getElementById("typing")?.remove();

const answer=
data.answer||
"Humooe не получил ответ от модели.";

messages.push({
role:"assistant",
content:answer
});

addMessage(
"assistant",
answer,
document.getElementById("messages")
);

if(currentChat===-1){

currentChat=chats.length;

chats.push({

title:text.slice(0,45),

messages:[...messages]

});

}else{

chats[currentChat].messages=[
...messages
];

}

save();

renderHistory();

chat.scrollTop=chat.scrollHeight;

}catch(error){

document.getElementById("typing")?.remove();

const answer=
"Не удалось связаться с Humooe AI.";

messages.push({
role:"assistant",
content:answer
});

addMessage(
"assistant",
answer,
document.getElementById("messages")
);

}

}

/* FILES */

function handleFile(element){

const file=element.files[0];

if(!file)return;

filePreview.classList.add("show");

filePreview.textContent="📎 "+file.name;

if(
file.type.startsWith("text/")||
file.name.endsWith(".txt")||
file.name.endsWith(".md")
){

if(file.size>500000){

filePreview.textContent=
"📎 Файл слишком большой. Максимум 500 КБ.";

return;

}

const reader=new FileReader();

reader.onload=()=>{

input.value=
"Файл: "+file.name+
"\n\nСодержимое файла:\n"+
reader.result;

input.dispatchEvent(
new Event("input")
);

};

reader.readAsText(file);

}

else if(file.type.startsWith("image/")){

filePreview.textContent=
"🖼️ "+file.name;

input.value=
"Я прикрепил изображение: "+
file.name+
". Сейчас моя модель не умеет напрямую видеть изображения.";

}

}

/* INPUT */

input.addEventListener("input",()=>{

input.style.height="auto";

input.style.height=
Math.min(input.scrollHeight,160)+"px";

});

input.addEventListener("keydown",event=>{

if(
event.key==="Enter"&&
!event.shiftKey
){

event.preventDefault();

send();

}

});

/* THEME */

if(
localStorage.getItem(THEME)==="light"
){

document.body.classList.add("light");

}

/* START */

renderHistory();

if(chats.length){

loadChat(chats.length-1);

}else{

welcome();

}

</script>

</body>
  </html>
