<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe Chat</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#060a10;
color:white;
overflow:hidden;
}


body::before{

content:"";

position:fixed;

width:500px;
height:500px;

background:radial-gradient(circle,#00e5ff,transparent 65%);

opacity:.15;

top:-150px;
right:-150px;

filter:blur(90px);

}



.app{

height:100vh;
display:flex;

}



/* меню */

.sidebar{

width:260px;

padding:25px;

background:#ffffff08;

border-right:1px solid #ffffff15;

backdrop-filter:blur(20px);

}



.logo{

font-size:25px;

font-weight:900;

margin-bottom:40px;

}



.logo span{

color:#00e5ff;

}



.menu{

width:100%;

height:55px;

margin-bottom:12px;

border:none;

border-radius:18px;

background:#ffffff10;

color:white;

text-align:left;

padding-left:20px;

font-size:16px;

cursor:pointer;

}




/* основа */


.main{

flex:1;

display:flex;

flex-direction:column;

}



header{

height:80px;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

}



.creator{

font-size:12px;

color:#7d8a99;

margin-top:5px;

}



.avatar{

width:45px;

height:45px;

border-radius:50%;

background:#ffffff15;

display:flex;

align-items:center;

justify-content:center;

}





/* глаз */


.home{

flex:1;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

text-align:center;

}



.eye-box{

position:relative;

width:260px;

height:180px;

display:flex;

align-items:center;

justify-content:center;

}



.eye{

width:230px;

height:130px;

background:white;

border-radius:100%;

box-shadow:
0 0 40px #00e5ff,
0 0 100px #00e5ff55;

position:relative;

animation:pulse 3s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.05);

}

}



.pupil{

position:absolute;

width:65px;

height:65px;

border-radius:50%;

background:#06111b;

top:32px;

left:82px;

box-shadow:0 0 30px #00e5ff;

animation:move 4s infinite;

}



@keyframes move{

50%{

transform:translateX(20px);

}

}




h1{

font-size:45px;

}



p{

color:#9aa7b5;

}



.start{

margin-top:30px;

height:60px;

padding:0 45px;

border:none;

border-radius:35px;

background:#00e5ff;

font-size:17px;

font-weight:bold;

cursor:pointer;

}
