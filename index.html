<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>


<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}


body{

margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;

}


/* ===== АНИМИРОВАННЫЙ ФОН ===== */


body::before{

content:"";

position:fixed;
inset:-200px;

background:

radial-gradient(circle at 20% 20%,#333,transparent 25%),
radial-gradient(circle at 80% 70%,#222,transparent 25%),
radial-gradient(circle at 50% 50%,#111,transparent 30%);

animation:
backgroundMove 15s infinite alternate;

z-index:-1;

}


@keyframes backgroundMove{

from{
transform:translate(0,0);
}

to{
transform:translate(60px,40px);
}

}



/* ===== APP ===== */


.app{

height:100vh;

display:flex;

flex-direction:column;

}



/* ===== HEADER ===== */


.header{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px;

}


.logo{

font-size:28px;

font-weight:700;

letter-spacing:-1px;

}


.logo span{

color:#999;

}



.profile{

width:48px;

height:48px;

border-radius:50%;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.15);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

transition:.3s;

}



.profile:hover{

transform:scale(1.1);

}



/* ===== HOME ===== */


.home{

padding:25px;

animation:show .6s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

}

}



h1{

font-size:40px;

line-height:1.1;

margin:0;

}



.subtitle{

color:#999;

font-size:18px;

margin-top:10px;

}



/* ===== CARDS ===== */


.card{

margin-top:30px;

padding:25px;

border-radius:30px;

background:

rgba(255,255,255,.06);

border:

1px solid rgba(255,255,255,.12);

backdrop-filter:blur(20px);

transition:.3s;

cursor:pointer;

}


.card:active{

transform:scale(.96);

}



.start{

margin-top:20px;

width:100%;

height:55px;

border:0;

border-radius:25px;

background:white;

color:black;

font-size:18px;

font-weight:600;

}



/* ===== QUICK BUTTONS ===== */


.quick{

display:flex;

gap:10px;

margin-top:25px;

overflow-x:auto;

}



.quick button{

padding:15px 20px;

border-radius:20px;

border:

1px solid rgba(255,255,255,.15);

background:

rgba(255,255,255,.08);

color:white;

}



/* ===== CHAT ===== */


.chat{

display:none;

flex:1;

padding:20px;

overflow:auto;

}



.message{

max-width:85%;

padding:16px;

border-radius:22px;

margin-bottom:15px;

animation:message .4s;

}



@keyframes message{

from{

opacity:0;

transform:translateY(20px);

}

}



.ai{

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.1);

}



.user{

margin-left:auto;

background:white;

color:black;

}



/* ===== INPUT ===== */


.bottom{

display:none;

padding:15px;

gap:10px;

}



.input{

flex:1;

height:55px;

border-radius:30px;

border:

1px solid rgba(255,255,255,.2);

background:

rgba(255,255,255,.08);

color:white;

padding:0 20px;

font-size:16px;

outline:none;

}



.send{

width:55px;

height:55px;

border-radius:50%;

border:0;

background:white;

color:black;

font-size:22px;

}



/* ===== MODAL ===== */


.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

display:none;

align-items:flex-end;

}



.window{

width:100%;

background:#111;

border-radius:35px 35px 0 0;

padding:30px;

animation:up .4s;

}



@keyframes up{

from{

transform:translateY(100%);

}

}



.window input{

width:100%;

height:55px;

margin-top:12px;

border-radius:20px;

border:1px solid #333;

background:#050505;

color:white;

padding:15px;

}



.window button{

width:100%;

height:55px;

margin-top:15px;

border-radius:20px;

border:0;

background:white;

color:black;

font-size:16px;

}



.close{

background:#333!important;

color:white!important;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="profile" onclick="openProfile()">
👤
</div>


</div>




<div class="home" id="home">


<h1>
Добрый вечер 👋
</h1>


<div class="subtitle">
Ваш персональный AI-помощник
</div>



<div class="card" onclick="openChat()">


<h2>
Новый чат
</h2>


<p>
Начать разговор с Humooe AI
</p>


<button class="start">
Начать
</button>


</div>




<h3>
Быстрый доступ
</h3>


<div class="quick">

<button>
🧮 Задачи
</button>

<button>
📚 Учёба
</button>

<button>
✍️ Тексты
</button>

</div>



</div>





<div class="chat" id="chat">


<div class="message ai">

Привет 👋

<br><br>

Я Humooe AI.
Готов помочь.

</div>


</div>





<div class="bottom" id="bottom">


<input
class="input"
id="input"
placeholder="Напишите сообщение..."
>


<button class="send" onclick="sendMessage()">

➤

</button>


</div>



</div>





<!-- ПРОФИЛЬ -->


<div class="modal" id="profileModal">


<div class="window">


<h2>
Аккаунт Humooe
</h2>


<p>
Войдите или создайте аккаунт
</p>


<button onclick="showLogin()">
Войти
</button>


<button onclick="showRegister()">
Регистрация
</button>


<button class="close" onclick="closeProfile()">
Закрыть
</button>


</div>


</div>





<!-- РЕГИСТРАЦИЯ -->


<div class="modal" id="authModal">


<div class="window">


<h2 id="authTitle">
Регистрация
</h2>



<input
id="email"
placeholder="Email"
>



<input
id="password"
type="password"
placeholder="Пароль"
>



<button onclick="authAction()" id="authButton">

Создать аккаунт

</button>



<button class="close" onclick="closeAuth()">

Закрыть

</button>



</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// =======================
// SUPABASE
// =======================


const SUPABASE_URL =
"https://reaajdispyhngnqdjsio.supabase.co";


const SUPABASE_KEY =
"sb_publishable_1UwuGu3Ni-BHNhfzmHTkVQ_iY_NPqMM";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// =======================
// ЧАТ
// =======================


function openChat(){

document
.getElementById("home")
.style.display="none";


document
.getElementById("chat")
.style.display="block";


document
.getElementById("bottom")
.style.display="flex";

}



function sendMessage(){


let input=
document.getElementById("input");


let text=
input.value.trim();



if(!text)return;



addMessage(
text,
"user"
);


input.value="";



setTimeout(()=>{


addMessage(
"🤖 Humooe AI получил сообщение.",
"ai"
);


},700);


}



function addMessage(text,type){


let div=
document.createElement("div");


div.className=
"message "+type;


div.innerHTML=text;


document
.getElementById("chat")
.appendChild(div);


}




document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter")
sendMessage();

});





// =======================
// ПРОФИЛЬ
// =======================


function openProfile(){

document
.getElementById("profileModal")
.style.display="flex";

}



function closeProfile(){

document
.getElementById("profileModal")
.style.display="none";

}





// =======================
// AUTH
// =======================


let mode="register";



function showLogin(){

mode="login";

document
.getElementById("authTitle")
.innerHTML="Вход";


document
.getElementById("authButton")
.innerHTML="Войти";


closeProfile();


document
.getElementById("authModal")
.style.display="flex";

}



function showRegister(){

mode="register";

document
.getElementById("authTitle")
.innerHTML="Регистрация";


document
.getElementById("authButton")
.innerHTML="Создать аккаунт";


closeProfile();


document
.getElementById("authModal")
.style.display="flex";

}



function closeAuth(){

document
.getElementById("authModal")
.style.display="none";

}




async function authAction(){


let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



if(mode==="register"){


let {error}=

await supabaseClient.auth.signUp({

email,
password

});



if(error)

alert(error.message);

else

alert("Аккаунт создан!");



}



else{


let {error}=

await supabaseClient.auth.signInWithPassword({

email,
password

});



if(error)

alert(error.message);

else

alert("Вы вошли!");



}



}



</script>


</body>
</html>
