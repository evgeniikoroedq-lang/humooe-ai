<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Humooe AI</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#080a0f;
--panel:#10131a;
--panel2:#151922;
--border:#272d39;
--text:#f5f7fb;
--muted:#8c95a5;
--accent:#fff;
--shadow:0 20px 70px #0008
}
*{scrollbar-width:thin;scrollbar-color:#333 #10131a}
body{
margin:0;background:radial-gradient(circle at 50% -20%,#242b38 0,#0b0e14 38%,#07090d 100%);
color:var(--text);font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex}
.sidebar{
width:280px;background:rgba(12,15,21,.92);backdrop-filter:blur(20px);
border-right:1px solid var(--border);display:flex;flex-direction:column;
padding:18px;z-index:20
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brandLogo{
width:42px;height:42px;border-radius:14px;
background:linear-gradient(135deg,#fff,#777);
color:#111;display:flex;align-items:center;justify-content:center;
font-size:21px;font-weight:900;box-shadow:0 0 30px #fff2
}
.brandText{font-size:20px;font-weight:800}
.newChat{
width:100%;padding:13px 15px;border:1px solid #333a47;border-radius:14px;
background:#f7f7f7;color:#111;font-weight:700;transition:.2s
}
.newChat:hover{transform:translateY(-1px);box-shadow:0 8px 25px #fff2}
.sectionTitle{font-size:11px;text-transform:uppercase;color:#697384;margin:24px 5px 8px}
.history{flex:1;overflow:auto}
.historyItem{
padding:12px;border-radius:12px;color:#b8c0cc;margin-bottom:4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer
}
.historyItem:hover{background:#1b202a;color:#fff}
.sidebarBottom{display:flex;gap:8px}
.sideBtn{
flex:1;padding:10px;background:#171b24;border:1px solid #2a303c;
border-radius:11px;color:#d7dce5
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;
justify-content:space-between;padding:0 22px;background:#0b0e14cc;backdrop-filter:blur(15px);z-index:5
}
.topTitle{font-weight:800;font-size:18px}
.menuBtn{
display:none;background:transparent;color:#fff;border:0;font-size:25px
}
.chat{
flex:1;overflow-y:auto;padding:35px 20px 150px;scroll-behavior:smooth
}
.welcome{
min-height:100%;display:flex;align-items:center;justify-content:center;
flex-direction:column;text-align:center;padding:20px
}
.orb{
width:105px;height:105px;border-radius:50%;
background:
radial-gradient(circle at 32% 25%,#fff 0,#ddd 18%,#777 48%,#222 78%,#000 100%);
box-shadow:0 0 25px #fff3,0 0 80px #fff1;
animation:orb 3s ease-in-out infinite;
position:relative
}
.orb:after{
content:"";position:absolute;inset:-13px;border-radius:50%;
border:1px solid #fff2;animation:ring 3s linear infinite
}
@keyframes orb{
0%,100%{transform:translateY(0) scale(1)}
50%{transform:translateY(-8px) scale(1.06)}
}
@keyframes ring{
0%{transform:scale(.9);opacity:.2}
50%{transform:scale(1.12);opacity:.7}
100%{transform:scale(.9);opacity:.2}
}
.welcome h1{
font-size:46px;letter-spacing:-1.5px;margin:28px 0 8px;
background:linear-gradient(90deg,#fff,#9aa3b3,#fff);background-size:200%;
-webkit-background-clip:text;background-clip:text;color:transparent;
animation:shine 4s linear infinite
}
@keyframes shine{to{background-position:200%}}
.welcome p{color:var(--muted);font-size:16px}
.messages{max-width:900px;margin:auto}
.message{display:flex;margin:18px 0;animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.message.user{justify-content:flex-end}
.bubble{
max-width:min(78%,760px);padding:14px 17px;border-radius:18px;
line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere
}
.user .bubble{background:#252b36;border:1px solid #303745}
.assistant .bubble{background:#12161e;border:1px solid #222936}
.actions{margin-top:7px;display:flex;gap:6px}
.copyBtn{
background:transparent;border:0;color:#70798a;font-size:12px;padding:4px 7px
}
.copyBtn:hover{color:#fff}
.typingDots{display:flex;gap:5px;align-items:center}
.typingDots span{
width:7px;height:7px;border-radius:50%;background:#aab1bd;
animation:dot 1.1s infinite
}
.typingDots span:nth-child(2){animation-delay:.15s}
.typingDots span:nth-child(3){animation-delay:.3s}
@keyframes dot{
0%,70%,100%{opacity:.25;transform:translateY(0)}
35%{opacity:1;transform:translateY(-4px)}
}
.inputWrap{
position:absolute;left:0;right:0;bottom:0;padding:18px 20px 20px;
background:linear-gradient(transparent,#080a0f 30%)
}
.inputBox{
max-width:900px;margin:auto;background:#141821;border:1px solid #303744;
border-radius:20px;padding:9px;display:flex;align-items:flex-end;
box-shadow:0 15px 50px #0007
}
textarea{
flex:1;resize:none;max-height:160px;min-height:44px;padding:11px 12px;
background:transparent;color:#fff;border:0;outline:0;line-height:1.45
}
textarea::placeholder{color:#6e7787}
.sendBtn{
width:44px;height:44px;border-radius:14px;border:0;background:#fff;color:#111;
font-weight:900;font-size:20px;transition:.2s
}
.sendBtn:hover{transform:scale(1.05)}
.attachBtn{
width:44px;height:44px;border-radius:14px;border:0;background:transparent;
color:#8c95a5;font-size:21px
}
.attachBtn:hover{background:#202631;color:#fff}
.filePreview{
max-width:900px;margin:0 auto 8px;display:none;padding:9px 12px;
background:#151a23;border:1px solid #2c3340;border-radius:12px;color:#aeb6c4;font-size:13px
}
.filePreview.show{display:block}
.mobileOverlay{display:none}
.light{
--bg:#f4f6fa;--panel:#fff;--panel2:#fff;--border:#d8dde6;--text:#111827;--muted:#667085;
background:#f4f6fa;color:#111827
}
.light .sidebar,.light .topbar{background:#ffffffdd}
.light .inputBox,.light .assistant .bubble,.light .filePreview{background:#fff}
.light .user .bubble{background:#e7ebf1;border-color:#d8dde6}
.light textarea{color:#111827}
.light .sideBtn{background:#f3f5f8;color:#222}
@media(max-width:750px){
.sidebar{
position:fixed;top:0;bottom:0;left:-290px;transition:.25s;
box-shadow:20px 0 50px #0008
}
.sidebar.open{left:0}
.mobileOverlay{
position:fixed;inset:0;background:#0008;z-index:15
}
.mobileOverlay.show{display:block}
.menuBtn{display:block}
.topbar{padding:0 15px}
.chat{padding:20px 12px 145px}
.welcome h1{font-size:36px}
.orb{width:85px;height:85px}
.bubble{max-width:90%;font-size:14px}
.inputWrap{padding:10px}
.inputBox{border-radius:17px}
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar" id="sidebar">
<div class="brand">
<div class="brandLogo">H</div>
<div class="brandText">Humooe AI</div>
</div>

<button class="newChat" onclick="newChat()">＋ Новый чат</button>

<div class="sectionTitle">История</div>
<div class="history" id="history"></div>

<div class="sidebarBottom">
<button class="sideBtn" onclick="toggleTheme()">◐ Тема</button>
<button class="sideBtn" onclick="clearHistory()">Очистить</button>
</div>
</aside>

<div class="mobileOverlay" id="overlay" onclick="toggleMenu()"></div>

<main class="main">

<header class="topbar">
<button class="menuBtn" onclick="toggleMenu()">☰</button>
<div class="topTitle">Humooe AI</div>
<div style="width:30px"></div>
</header>

<section class="chat" id="chat"></section>

<div class="inputWrap">
<div class="filePreview" id="filePreview"></div>
<div class="inputBox">

<button class="attachBtn" onclick="document.getElementById('file').click()">＋</button>
<input id="file" type="file" hidden onchange="handleFile(this)">

<textarea id="input" rows="1" placeholder="Напишите сообщение..."></textarea>

<button class="sendBtn" onclick="send()">↑</button>

</div>
</div>

</main>
</div>

<script>
const API="https://hummoe-ai.evgeniikoroedq.workers.dev";

let messages=[];
let chats=JSON.parse(localStorage.getItem("humooe_chats")||"[]");
let currentChat=-1;

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const history=document.getElementById("history");
const filePreview=document.getElementById("filePreview");

function save(){
localStorage.setItem("humooe_chats",JSON.stringify(chats));
}

function showWelcome(){
chat.innerHTML=`
<div class="welcome">
<div class="orb"></div>
<h1>Humooe AI</h1>
<p>Ваш умный AI-помощник</p>
</div>`;
}

function renderHistory(){
history.innerHTML="";
chats.forEach((c,i)=>{
const item=document.createElement("div");
item.className="historyItem";
item.textContent=c.title||"Новый чат";
item.onclick=()=>loadChat(i);
history.appendChild(item);
});
}

function loadChat(i){
currentChat=i;
messages=[...(chats[i].messages||[])];
renderMessages();
closeMobile();
}

function newChat(){
currentChat=-1;
messages=[];
showWelcome();
closeMobile();
input.focus();
}

function clearHistory(){
if(!confirm("Удалить историю чатов?"))return;
chats=[];
currentChat=-1;
messages=[];
save();
renderHistory();
showWelcome();
}

function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("humooe_theme",
document.body.classList.contains("light")?"light":"dark");
}

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
document.getElementById("overlay").classList.toggle("show");
}

function closeMobile(){
document.getElementById("sidebar").classList.remove("open");
document.getElementById("overlay").classList.remove("show");
}

function renderMessages(){
chat.innerHTML='<div class="messages" id="messages"></div>';
const box=document.getElementById("messages");
messages.forEach((m,i)=>addMessage(m.role,m.content,box,i));
chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,text,parent=chat,index=-1){
if(parent===chat){
chat.innerHTML='<div class="messages" id="messages"></div>';
parent=document.getElementById("messages");
}

const row=document.createElement("div");
row.className="message "+role;

const content=document.createElement("div");
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;
content.appendChild(bubble);

if(role==="assistant"){
const actions=document.createElement("div");
actions.className="actions";

const copy=document.createElement("button");
copy.className="copyBtn";
copy.textContent="Копировать";
copy.onclick=async()=>{
try{
await navigator.clipboard.writeText(text);
copy.textContent="Скопировано ✓";
setTimeout(()=>copy.textContent="Копировать",1200);
}catch(e){}
};

actions.appendChild(copy);
content.appendChild(actions);
}

row.appendChild(content);
parent.appendChild(row);
return row;
}

function addTyping(){
const box=document.getElementById("messages")||chat;
const row=document.createElement("div");
row.className="message assistant";
row.id="typing";

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.innerHTML='<div class="typingDots"><span></span><span></span><span></span></div>';

row.appendChild(bubble);
box.appendChild(row);
chat.scrollTop=chat.scrollHeight;
}

async function send(){
const text=input.value.trim();
if(!text)return;

if(!messages.length){
chat.innerHTML='<div class="messages" id="messages"></div>';
}

messages.push({role:"user",content:text});
addMessage("user",text,document.getElementById("messages"));

input.value="";
input.style.height="auto";
chat.scrollTop=chat.scrollHeight;

addTyping();

try{
const response=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({messages:messages.slice(-20)})
});

const data=await response.json();

document.getElementById("typing")?.remove();

const answer=data.answer||"Ошибка ответа Humooe.";

messages.push({role:"assistant",content:answer});
addMessage("assistant",answer,document.getElementById("messages"));

if(currentChat===-1){
currentChat=chats.length;
chats.push({
title:text.slice(0,45),
messages:[...messages]
});
}else{
chats[currentChat].messages=[...messages];
}

save();
renderHistory();
chat.scrollTop=chat.scrollHeight;

}catch(error){
document.getElementById("typing")?.remove();
const answer="Не удалось связаться с Humooe AI.";
messages.push({role:"assistant",content:answer});
addMessage("assistant",answer,document.getElementById("messages"));
}
}

function handleFile(el){
const file=el.files[0];
if(!file)return;

filePreview.classList.add("show");
filePreview.textContent="📎 "+file.name;

if(file.type.startsWith("text/")||file.name.endsWith(".txt")||file.name.endsWith(".md")){
if(file.size>500000){
filePreview.textContent="📎 Файл слишком большой (максимум 500 КБ)";
return;
}

const reader=new FileReader();

reader.onload=()=>{
input.value=
"Файл: "+file.name+
"\n\nСодержимое файла:\n"+reader.result;
input.dispatchEvent(new Event("input"));
};

reader.readAsText(file);
}else if(file.type.startsWith("image/")){
filePreview.textContent="🖼️ "+file.name+" — изображение прикреплено";
input.value="Я прикрепил изображение: "+file.name+
". Сейчас моя модель не умеет напрямую видеть изображения. Если нужно, помоги мне понять, как работать с этим файлом.";
}
}

input.addEventListener("input",()=>{
input.style.height="auto";
input.style.height=Math.min(input.scrollHeight,160)+"px";
});

input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
send();
}
});

if(localStorage.getItem("humooe_theme")==="light"){
document.body.classList.add("light");
}

renderHistory();

if(chats.length){
loadChat(chats.length-1);
}else{
showWelcome();
}
</script>
</body>
</html>
