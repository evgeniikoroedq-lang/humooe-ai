<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    font-family:Arial, sans-serif;
    background:#070712;
    color:white;
    overflow:hidden;
}

/* Анимированный фон */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    animation:move 12s infinite alternate;
}

.c1{
    width:300px;
    height:300px;
    background:#6d28d9;
    top:-80px;
    left:-80px;
}

.c2{
    width:350px;
    height:350px;
    background:#2563eb;
    right:-100px;
    bottom:-100px;
    animation-delay:2s;
}

.c3{
    width:250px;
    height:250px;
    background:#ec4899;
    left:40%;
    top:40%;
    animation-delay:4s;
}

@keyframes move{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(80px,60px);
    }
}


/* приложение */

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* верх */

.header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
}


.logo span{
    color:#8b5cf6;
}


.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}



/* чат */

.chat{
    flex:1;
    padding:20px;
    overflow-y:auto;
}


.message{
    max-width:85%;
    padding:14px 18px;
    margin-bottom:15px;
    border-radius:20px;
    animation:show .35s ease;
}


@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}


.ai{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
}


.user{
    margin-left:auto;
    background:#6d28d9;
}



/* быстрые кнопки */

.quick{
    display:flex;
    gap:10px;
    padding:10px 20px;
    overflow-x:auto;
}


.quick button{
    white-space:nowrap;
    border:0;
    padding:12px 18px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    color:white;
    cursor:pointer;
}



/* ввод */

.bottom{
    padding:15px;
    display:flex;
    gap:10px;
}


.input{
    flex:1;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:15px 20px;
    color:white;
    outline:none;
}


.send{
    width:55px;
    height:55px;
    border-radius:50%;
    border:0;
    background:#8b5cf6;
    color:white;
    font-size:20px;
}



/* мобильная настройка */

@media(max-width:600px){

.logo{
    font-size:22px;
}

.chat{
    padding:15px;
}

.message{
    max-width:90%;
}

}

</style>

</head>


<body>


<div class="bg">
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
</div>



<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>

<div class="profile">
👤
</div>

</div>



<div class="chat" id="chat">

<div class="message ai">
👋 Привет! Я Humooe AI.<br>
Чем могу помочь?
</div>

</div>



<div class="quick">

<button>🧮 Решить задачу</button>
<button>📚 Объяснить тему</button>
<button>✍️ Написать текст</button>
<button>💡 Идеи</button>

</div>



<div class="bottom">

<input class="input" placeholder="Напишите вопрос..." id="input">

<button class="send">
➤
</button>

</div>



</div>


</body>
</html>
