<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>Humooe AI</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070912;
  --panel:#0d111c;
  --panel2:#121827;
  --border:#252d40;
  --text:#f5f7ff;
  --muted:#8993a8;
  --accent:#8b7cff;
  --accent2:#5ce1e6;
  --danger:#ff5d73;
  --shadow:0 20px 70px #0008;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button,textarea,input{font:inherit}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.13;
  pointer-events:none;
  z-index:0;
  animation:blob 12s ease-in-out infinite alternate;
}

body:before{
  background:#765cff;
  top:-130px;
  left:-100px;
}

body:after{
  background:#19dce8;
  right:-130px;
  bottom:-150px;
  animation-delay:-5s;
}

@keyframes blob{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(70px,40px) scale(1.25)}
}

.app{
  width:100%;
  height:100%;
  display:flex;
  position:relative;
  z-index:1;
}

/* SIDEBAR */

.sidebar{
  width:285px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  padding:18px;
  background:rgba(10,14,24,.88);
  border-right:1px solid var(--border);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  z-index:30;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#10121a;
  font-weight:900;
  font-size:21px;
  background:linear-gradient(135deg,#fff,#8e91ff);
  box-shadow:0 0 30px #8176ff55;
  animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.07) rotate(4deg)}
}

.brandName{
  font-size:20px;
  font-weight:800;
}

.newChat{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:15px;
  color:#10121a;
  background:linear-gradient(135deg,#fff,#d9d8ff);
  font-weight:800;
  box-shadow:0 8px 30px #8176ff22;
  transition:.2s;
}

.newChat:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px #8176ff44;
}

.newChat:active{
  transform:scale(.97);
}

.section{
  margin:25px 5px 9px;
  font-size:11px;
  color:#68738a;
  text-transform:uppercase;
  letter-spacing:1px;
}

.history{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
}

.historyItem{
  padding:13px;
  margin-bottom:5px;
  border:1px solid transparent;
  border-radius:13px;
  color:#b8c1d2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:.2s;
}

.historyItem:hover{
  background:#171d2a;
  border-color:#293248;
  color:#fff;
}

.historyItem:active{
  transform:scale(.98);
}

.bottom{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.bottom button{
  flex:1;
  min-height:43px;
  border:1px solid #293145;
  border-radius:12px;
  background:#131927;
  color:#d8deea;
  transition:.2s;
}

.bottom button:hover{
  background:#1b2232;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:rgba(7,9,18,.65);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  z-index:10;
}

.title{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.3px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8993a8;
  font-size:12px;
}

.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#55e69b;
  box-shadow:0 0 12px #55e69b;
  animation:status 2s infinite;
}

@keyframes status{
  50%{opacity:.35;transform:scale(.7)}
}

.menu{
  display:none;
  width:43px;
  height:43px;
  border:1px solid #293145;
  border-radius:13px;
  background:#111725;
  color:white;
  font-size:22px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:30px 18px 155px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

.messages{
  max-width:900px;
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px 10px;
  animation:welcomeIn .7s ease;
}

@keyframes welcomeIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.orb{
  width:112px;
  height:112px;
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(circle at 30% 24%,#fff 0,#ddd 15%,#918bff 38%,#29284d 67%,#080912 100%);
  box-shadow:
    0 0 30px #8c7cff55,
    0 0 100px #695cff33;
  animation:orbFloat 4s ease-in-out infinite;
}

.orb:before,
.orb:after{
  content:"";
  position:absolute;
  inset:-15px;
  border:1px solid #8b7cff55;
  border-radius:50%;
  animation:ring 3s linear infinite;
}

.orb:after{
  inset:-29px;
  border-color:#5ce1e633;
  animation-duration:5s;
  animation-direction:reverse;
}

@keyframes orbFloat{
  0%,100%{transform:translateY(0) rotate(0) scale(1)}
  50%{transform:translateY(-12px) rotate(4deg) scale(1.06)}
}

@keyframes ring{
  from{transform:rotate(0) scale(.9);opacity:.15}
  50%{opacity:.8}
  to{transform:rotate(360deg) scale(1.08);opacity:.15}
}

.welcome h1{
  margin:35px 0 8px;
  font-size:clamp(38px,6vw,58px);
  letter-spacing:-2px;
  background:linear-gradient(
    90deg,
    #fff,
    #9c91ff,
    #5ce1e6,
    #fff
  );
  background-size:300%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:titleShine 5s linear infinite;
}

@keyframes titleShine{
  to{background-position:300%}
}

.welcome p{
  margin:0;
  color:var(--muted);
  font-size:15px;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  max-width:620px;
  margin-top:25px;
}

.quick button{
  padding:10px 14px;
  border:1px solid #293248;
  border-radius:13px;
  background:#101625aa;
  color:#bfc7d8;
  transition:.2s;
}

.quick button:hover{
  transform:translateY(-2px);
  border-color:#7168d9;
  color:#fff;
  background:#151b2c;
}

/* MESSAGES */

.message{
  display:flex;
  margin:18px 0;
  animation:messageIn .3s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(80%,760px);
  padding:14px 17px;
  border-radius:19px;
  line-height:1.6;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:linear-gradient(135deg,#292f40,#222838);
  border:1px solid #394257;
  box-shadow:0 8px 30px #0002;
}

.assistant .bubble{
  background:rgba(14,19,31,.92);
  border:1px solid #252e41;
  box-shadow:0 8px 35px #0003;
}

.actions{
  margin-top:7px;
}

.copy{
  border:0;
  background:transparent;
  color:#68738a;
  font-size:12px;
  padding:4px 7px;
}

.copy:hover{
  color:white;
}

/* TYPING */

.dots{
  display:flex;
  gap:5px;
}

.dots span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#9c94ff;
  animation:dot 1.1s infinite;
}

.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}

@keyframes dot{
  0%,70%,100%{
    opacity:.2;
    transform:translateY(0);
  }
  35%{
    opacity:1;
    transform:translateY(-5px);
  }
}

/* INPUT */

.inputWrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    rgba(7,9,18,.92) 30%,
    #070912 100%
  );
  z-index:8;
}

.filePreview{
  max-width:900px;
  margin:0 auto 8px;
  padding:9px 12px;
  border-radius:12px;
  background:#111827;
  border:1px solid #2b3449;
  color:#aeb8ca;
  font-size:13px;
  display:none;
}

.filePreview.show{
  display:block;
  animation:messageIn .25s ease;
}

.inputBox{
  max-width:900px;
  margin:auto;
  min-height:62px;
  display:flex;
  align-items:flex-end;
  gap:4px;
  padding:8px;
  border:1px solid #303a50;
  border-radius:21px;
  background:rgba(16,21,34,.94);
  box-shadow:
    0 18px 60px #0009,
    0 0 0 1px #ffffff05 inset;
  transition:.25s;
}

.inputBox:focus-within{
  border-color:#655cbe;
  box-shadow:
    0 18px 60px #0009,
    0 0 0 3px #756bff12;
}

textarea{
  flex:1;
  min-width:0;
  min-height:45px;
  max-height:170px;
  resize:none;
  padding:12px 11px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  line-height:1.45;
}

textarea::placeholder{
  color:#69748a;
}

.attach,
.send{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:14px;
  border:0;
  transition:.2s;
}

.attach{
  background:transparent;
  color:#8994aa;
  font-size:21px;
}

.attach:hover{
  background:#1d2535;
  color:white;
}

.send{
  background:linear-gradient(135deg,#fff,#bfc4ff);
  color:#11131a;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 20px #8c83ff22;
}

.send:hover{
  transform:translateY(-2px) scale(1.03);
}

.send:active,
.attach:active{
  transform:scale(.92);
}

.hint{
  max-width:900px;
  margin:7px auto 0;
  text-align:center;
  color:#555f73;
  font-size:10px;
}

/* OVERLAY */

.overlay{
  display:none;
}

/* LIGHT THEME */

body.light{
  --bg:#f3f5fa;
  --panel:#fff;
  --panel2:#fff;
  --border:#dce1eb;
  --text:#151925;
  --muted:#6b7487;
  background:#f3f5fa;
}

body.light .sidebar,
body.light .topbar{
  background:rgba(255,255,255,.88);
}

body.light .inputBox{
  background:#fff;
  border-color:#d5dbe7;
}

body.light textarea{
  color:#151925;
}

body.light .assistant .bubble{
  background:#fff;
  border-color:#dce1eb;
}

body.light .user .bubble{
  background:#e7eaf1;
  border-color:#d8dce5;
  color:#151925;
}

body.light .bottom button,
body.light .menu{
  background:#f5f6fa;
  color:#303747;
  border-color:#dce1eb;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:-300px;
    transition:left .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:20px 0 60px #0009;
  }

  .sidebar.open{
    left:0;
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:25;
    animation:fade .2s ease;
  }

  @keyframes fade{
    from{opacity:0}
    to{opacity:1}
  }

  .menu{
    display:block;
  }

  .topbar{
    height:58px;
    padding:0 12px;
  }

  .topbar .title{
    font-size:17px;
  }

  .status{
    display:none;
  }

  .chat{
    padding:18px 10px 145px;
  }

  .welcome{
    padding:20px 5px;
  }

  .orb{
    width:88px;
    height:88px;
  }

  .welcome h1{
    margin-top:28px;
    font-size:40px;
  }

  .welcome p{
    font-size:14px;
  }

  .quick{
    gap:7px;
    margin-top:20px;
  }

  .quick button{
    padding:9px 11px;
    font-size:12px;
  }

  .message{
    margin:14px 0;
  }

  .bubble{
    max-width:91%;
    padding:12px 14px;
    border-radius:17px;
    font-size:14px;
  }

  .inputWrap{
    padding:8px 8px calc(9px + env(safe-area-inset-bottom));
  }

  .inputBox{
    min-height:57px;
    border-radius:18px;
    padding:6px;
  }

  textarea{
    min-height:44px;
    padding:11px 8px;
    font-size:16px;
  }

  .attach,
  .send{
    width:44px;
    height:44px;
    border-radius:13px;
  }

  .hint{
    display:none;
  }
}

@media(max-width:380px){

  .welcome h1{
    font-size:34px;
  }

  .quick button{
    font-size:11px;
  }

  .bubble{
    max-width:94%;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="logo">H</div>
    <div class="brandName">Humooe AI</div>
  </div>

  <button class="newChat" onclick="newChat()">
    ＋ Новый чат
  </button>

  <div class="section">История</div>

  <div class="history" id="history"></div>

  <div class="bottom">
    <button onclick="toggleTheme()">◐ Тема</button>
    <button onclick="clearHistory()">Очистить</button>
  </div>

</aside>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<main class="main">

  <header class="topbar">

    <button class="menu" onclick="toggleMenu()">☰</button>

    <div class="title">Humooe AI</div>

    <div class="status">
      <span class="statusDot"></span>
      Онлайн
    </div>

  </header>

  <section class="chat" id="chat"></section>

  <div class="inputWrap">

    <div class="filePreview" id="filePreview"></div>

    <div class="inputBox">

      <button
        class="attach"
        onclick="document.getElementById('file').click()"
        title="Фото или файл"
      >＋</button>

      <input
        id="file"
        type="file"
        hidden
        accept="image/*,.txt,.md"
        onchange="handleFile(this)"
      >

      <textarea
        id="input"
        rows="1"
        placeholder="Задайте письменный вопрос..."
      ></textarea>

      <button
        class="send"
        onclick="send()"
        title="Отправить"
      >↑</button>

    </div>

    <div class="hint">
      Enter — отправить · Shift + Enter — новая строка
    </div>

  </div>

</main>

</div>

<script>

const API="https://hummoe-ai.evgeniikoroedq.workers.dev";

const STORAGE="humooe_private_chats_v3";
const THEME="humooe_theme_v3";

let messages=[];
let currentChat=-1;
let chats=[];

try{
  chats=JSON.parse(localStorage.getItem(STORAGE)||"[]");
  if(!Array.isArray(chats)) chats=[];
}catch{
  chats=[];
}

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const history=document.getElementById("history");
const filePreview=document.getElementById("filePreview");

function save(){
  localStorage.setItem(STORAGE,JSON.stringify(chats));
}

function showWelcome(){

  chat.innerHTML=`

    <div class="welcome">

      <div class="orb"></div>

      <h1>Humooe AI</h1>

      <p>Задайте любой письменный вопрос</p>

      <div class="quick">

        <button onclick="quickAsk('Реши эту задачу и объясни решение по шагам')">
          🧮 Решить задачу
        </button>

        <button onclick="quickAsk('Объясни мне эту тему простыми словами')">
          📚 Объяснить тему
        </button>

        <button onclick="quickAsk('Помоги написать текст')">
          ✍️ Написать текст
        </button>

        <button onclick="quickAsk('Помоги мне разобраться с этим вопросом')">
          💡 Помочь с вопросом
        </button>

      </div>

    </div>

  `;

}

function quickAsk(text){
  input.value=text;
  input.dispatchEvent(new Event("input"));
  input.focus();
}

function renderHistory(){

  history.innerHTML="";

  chats.forEach((item,index)=>{

    const el=document.createElement("div");

    el.className="historyItem";

    el.textContent=item.title||"Новый чат";

    el.onclick=()=>loadChat(index);

    history.appendChild(el);

  });

}

function loadChat(index){

  currentChat=index;

  messages=[...(chats[index].messages||[])];

  renderMessages();

  closeMenu();

}

function newChat(){

  currentChat=-1;

  messages=[];

  showWelcome();

  closeMenu();

  input.focus();

}

function clearHistory(){

  if(!confirm("Удалить историю чатов этого браузера?")) return;

  chats=[];

  messages=[];

  currentChat=-1;

  save();

  renderHistory();

  showWelcome();

}

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    THEME,
    document.body.classList.contains("light")
      ?"light"
      :"dark"
  );

}

function toggleMenu(){

  document.getElementById("sidebar").classList.toggle("open");

  document.getElementById("overlay").classList.toggle("show");

}

function closeMenu(){

  document.getElementById("sidebar").classList.remove("open");

  document.getElementById("overlay").classList.remove("show");

}

function renderMessages(){

  chat.innerHTML=`
    <div class="messages" id="messages"></div>
  `;

  const box=document.getElementById("messages");

  messages.forEach(m=>{
    addMessage(m.role,m.content,box);
  });

  scrollBottom();

}

function addMessage(role,text,parent){

  const row=document.createElement("div");

  row.className="message "+role;

  const content=document.createElement("div");

  const bubble=document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  content.appendChild(bubble);

  if(role==="assistant"){

    const actions=document.createElement("div");

    actions.className="actions";

    const copy=document.createElement("button");

    copy.className="copy";

    copy.textContent="Копировать";

    copy.onclick=async()=>{

      try{

        await navigator.clipboard.writeText(text);

        copy.textContent="Скопировано ✓";

        setTimeout(()=>{
          copy.textContent="Копировать";
        },1200);

      }catch{}

    };

    actions.appendChild(copy);

    content.appendChild(actions);

  }

  row.appendChild(content);

  parent.appendChild(row);

}

function addTyping(){

  const box=document.getElementById("messages");

  if(!box)return;

  const row=document.createElement("div");

  row.className="message assistant";

  row.id="typing";

  const bubble=document.createElement("div");

  bubble.className="bubble";

  bubble.innerHTML=`
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  row.appendChild(bubble);

  box.appendChild(row);

  scrollBottom();

}

function scrollBottom(){

  requestAnimationFrame(()=>{
    chat.scrollTop=chat.scrollHeight;
  });

}

async function send(){

  const text=input.value.trim();

  if(!text)return;

  if(!messages.length){

    chat.innerHTML=`
      <div class="messages" id="messages"></div>
    `;

  }

  messages.push({
    role:"user",
    content:text
  });

  addMessage(
    "user",
    text,
    document.getElementById("messages")
  );

  input.value="";
  input.style.height="auto";

  addTyping();

  try{

    const response=await fetch(API,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages:messages.slice(-20)
      })

    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();

    document.getElementById("typing")?.remove();

    const answer=
      data.answer||
      "Humooe не получил ответ от модели.";

    messages.push({
      role:"assistant",
      content:answer
    });

    addMessage(
      "assistant",
      answer,
      document.getElementById("messages")
    );

    if(currentChat===-1){

      currentChat=chats.length;

      chats.push({
        title:text.slice(0,45),
        messages:[...messages]
      });

    }else{

      chats[currentChat].messages=[
        ...messages
      ];

    }

    save();

    renderHistory();

    scrollBottom();

  }catch(error){

    document.getElementById("typing")?.remove();

    const answer=
      "Не удалось связаться с Humooe AI.";

    messages.push({
      role:"assistant",
      content:answer
    });

    addMessage(
      "assistant",
      answer,
      document.getElementById("messages")
    );

    scrollBottom();

  }

}

/* ФОТО И ТЕКСТОВЫЕ ФАЙЛЫ */

function handleFile(element){

  const file=element.files[0];

  if(!file)return;

  filePreview.classList.add("show");

  if(file.type.startsWith("image/")){

    filePreview.textContent=
      "🖼️ Фото: "+file.name+
      " — просмотр доступен, но текущая модель не анализирует изображение.";

    return;

  }

  if(
    file.type.startsWith("text/")||
    file.name.endsWith(".txt")||
    file.name.endsWith(".md")
  ){

    if(file.size>500000){

      filePreview.textContent=
        "📄 Файл слишком большой. Максимум 500 КБ.";

      return;

    }

    const reader=new FileReader();

    reader.onload=()=>{

      input.value=
        "Файл: "+file.name+
        "\n\nСодержимое файла:\n"+
        reader.result;

      input.dispatchEvent(new Event("input"));

      input.focus();

    };

    reader.readAsText(file);

    return;

  }

  filePreview.textContent=
    "📎 Этот тип файла пока не поддерживается.";

}

/* TEXTAREA */

input.addEventListener("input",()=>{

  input.style.height="auto";

  input.style.height=
    Math.min(input.scrollHeight,170)+"px";

});

input.addEventListener("keydown",event=>{

  if(
    event.key==="Enter"&&
    !event.shiftKey
  ){

    event.preventDefault();

    send();

  }

});

/* THEME */

if(localStorage.getItem(THEME)==="light"){
  document.body.classList.add("light");
}

/* START */

renderHistory();

if(chats.length){
  loadChat(chats.length-1);
}else{
  showWelcome();
}

</script>
