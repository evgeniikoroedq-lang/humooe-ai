<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial, sans-serif;
background:#050510;
color:white;
}


/* ===== BACKGROUND ===== */

.bg{
position:fixed;
inset:0;
overflow:hidden;
z-index:-1;
}


.glow{
position:absolute;
border-radius:50%;
filter:blur(90px);
animation:move 12s infinite alternate;
}


.glow1{
width:350px;
height:350px;
background:#7c3aed;
top:-120px;
left:-120px;
}


.glow2{
width:400px;
height:400px;
background:#2563eb;
right:-150px;
bottom:-150px;
animation-delay:3s;
}


.glow3{
width:250px;
height:250px;
background:#c026d3;
left:40%;
top:40%;
animation-delay:6s;
}


@keyframes move{

from{
transform:translate(0,0);
}

to{
transform:translate(80px,70px);
}

}



/* ===== APP ===== */


.app{

height:100vh;
display:flex;
flex-direction:column;

}



/* ===== HEADER ===== */


.header{

padding:20px;

display:flex;
justify-content:space-between;
align-items:center;

}



.logo{

font-size:28px;
font-weight:900;

animation:fade .8s;

}


.logo span{

color:#8b5cf6;

}



@keyframes fade{

from{
opacity:0;
transform:translateY(-20px);
}

to{
opacity:1;
}

}



.profile{

width:45px;
height:45px;

border-radius:50%;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(20px);

display:flex;
align-items:center;
justify-content:center;

animation:pulse 3s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.1);

box-shadow:
0 0 35px #8b5cf6;

}

}



/* ===== AI CORE ===== */


.core{

display:flex;
justify-content:center;

padding:15px;

}


.ai-core{

width:120px;
height:120px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:45px;

background:
linear-gradient(
135deg,
#8b5cf6,
#2563eb
);


box-shadow:
0 0 50px #7c3aed;


animation:
pulse 3s infinite,
spin 8s linear infinite;

}



@keyframes spin{

from{
filter:hue-rotate(0deg);
}

to{
filter:hue-rotate(360deg);
}

}


/* ===== CHAT ===== */


.chat{

flex:1;

overflow-y:auto;

padding:20px;

}


.message{

max-width:85%;

padding:15px;

margin-bottom:15px;

border-radius:22px;

animation:show .4s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

}

}


.ai{

background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.15);

backdrop-filter:blur(20px);

}



.user{

margin-left:auto;

background:
linear-gradient(
135deg,
#7c3aed,
#2563eb
);

}



/* ===== MOBILE ===== */


@media(max-width:600px){

.logo{

font-size:23px;

}


.chat{

padding:15px;

}

}


    </style>
    
</head>

<body>


<div class="bg">

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

</div>



<div class="app">


<div class="header">

<div class="logo">
Humooe <span>AI</span>
</div>


<div class="profile" id="profileBtn">
👤
</div>


</div>



<div class="core">

<div class="ai-core">
✦
</div>

</div>




<div class="chat" id="chat">


<div class="message ai">

👋 Привет! Я Humooe AI.

<br><br>

Могу помочь:
<br>
🧮 решить задачу
<br>
📚 объяснить тему
<br>
✍️ создать текст
<br>
💡 придумать идеи

</div>


</div>




<div class="quick">


<button>
🧮 Задача
</button>


<button>
📚 Учёба
</button>


<button>
✍️ Текст
</button>


<button>
💡 Идеи
</button>


</div>




<div class="bottom">


<input 
class="input"
id="input"
placeholder="Напишите вопрос..."
>


<button class="send" id="send">

➤

</button>



</div>



</div>
<script>


// ===== НАСТРОЙКА AI =====

// сюда позже вставишь адрес своего Cloudflare Worker
const AI_API = "ВСТАВЬ_СЮДА_WORKER_URL";


// ===== ЭЛЕМЕНТЫ =====

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");



// ===== ДОБАВЛЕНИЕ СООБЩЕНИЯ =====


function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}



// ===== АНИМАЦИЯ AI =====


function showTyping(){


const div=document.createElement("div");

div.className="message ai";

div.id="typing";

div.innerHTML=
"Humooe AI думает <span>.</span><span>.</span><span>.</span>";


chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;


}



function hideTyping(){

const t=document.getElementById("typing");

if(t){

t.remove();

}

}




// ===== ОТПРАВКА =====


async function sendMessage(){


const text=input.value.trim();


if(!text)return;



addMessage(text,"user");


input.value="";


showTyping();



try{


// Если Worker подключён

if(AI_API && !AI_API.includes("ВСТАВЬ")){


const response = await fetch(AI_API,{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

message:text

})


});



const data=await response.json();



hideTyping();


addMessage(
data.reply || data.response || "Нет ответа",
"ai"
);



}


// временный режим

else{


setTimeout(()=>{


hideTyping();


addMessage(

"🚀 AI пока не подключён. Добавь адрес Worker в настройках.",

"ai"

);


},1200);



}



}

catch(error){


hideTyping();


addMessage(

"❌ Ошибка подключения к AI",

"ai"

);


}



}



// кнопка

send.addEventListener(
"click",
sendMessage
);




// Enter

input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

sendMessage();

}

});




// быстрые кнопки


document
.querySelectorAll(".quick button")
.forEach(button=>{


button.addEventListener("click",()=>{


input.value=button.innerText;

sendMessage();


});


});



// профиль

document
.getElementById("profileBtn")
.onclick=()=>{


alert(
"👤 Авторизация будет добавлена следующим этапом"
);


};



</script>


</body>
</html>
