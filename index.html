<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI Vision</title>

<style>

*{
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}


body{

margin:0;
height:100vh;
background:#070b12;
color:#fff;
overflow:hidden;

}



body::before{

content:"";

position:fixed;

width:500px;
height:500px;

background:radial-gradient(
circle,
#00e5ff,
transparent 65%
);

opacity:.18;

top:-150px;
right:-100px;

filter:blur(100px);

}





.app{

height:100vh;

display:flex;

}





/* МЕНЮ */


.sidebar{

width:260px;

padding:25px;

background:#ffffff08;

border-right:1px solid #ffffff15;

backdrop-filter:blur(20px);

}



.logo{

font-size:26px;

font-weight:800;

margin-bottom:40px;

}



.logo span{

color:#00e5ff;

}



.menu{

width:100%;

height:55px;

margin-bottom:12px;

border:none;

border-radius:18px;

background:#ffffff08;

color:#aaa;

font-size:16px;

text-align:left;

padding-left:20px;

cursor:pointer;

}



.menu:hover{

background:#00e5ff20;

color:white;

}







/* ОСНОВА */


.main{

flex:1;

display:flex;

flex-direction:column;

}





header{

height:80px;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

}



.avatar{

width:45px;

height:45px;

border-radius:50%;

background:#ffffff10;

display:flex;

align-items:center;

justify-content:center;

}







/* ГЛАЗ */


.center{

flex:1;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}



.eye{

width:230px;

height:130px;

border-radius:100%;

background:

linear-gradient(
180deg,
#ffffff,
#bdefff
);


position:relative;

box-shadow:

0 0 40px #00e5ff,
0 0 120px #00e5ff55;


animation:eyePulse 4s infinite;


}



@keyframes eyePulse{


50%{

transform:scale(1.05);

}


}





.pupil{

position:absolute;

width:65px;

height:65px;

border-radius:50%;

background:#07111c;

top:32px;

left:82px;


box-shadow:

0 0 30px #00e5ff;


animation:look 5s infinite;

}




@keyframes look{


0%,100%{

transform:translateX(0);

}


50%{

transform:translateX(20px);

}



}



.ring{

position:absolute;

width:280px;

height:180px;

border-radius:50%;

border:1px solid #00e5ff55;

animation:rotate 8s linear infinite;

}



@keyframes rotate{

from{

transform:rotate(0);

}

to{

transform:rotate(360deg);

}

}





h1{

font-size:45px;

margin-top:60px;

}



p{

color:#91a0ad;

font-size:18px;

}





.start{

margin-top:30px;

height:60px;

padding:0 45px;

border:none;

border-radius:30px;

background:#00e5ff;

color:#001018;

font-size:17px;

font-weight:bold;

cursor:pointer;

}






/* ЧАТ */


.chat{

display:none;

flex:1;

flex-direction:column;

padding:25px;

}



.messages{

flex:1;

overflow:auto;

}



.message{

max-width:70%;

padding:16px;

border-radius:20px;

margin-bottom:15px;

}



.ai{

background:#ffffff12;

}



.user{

background:#00e5ff;

color:#001018;

margin-left:auto;

}



.input{

display:flex;

gap:10px;

}



.input input{

flex:1;

height:55px;

border-radius:30px;

border:1px solid #ffffff20;

background:#ffffff10;

color:white;

padding:0 20px;

}



.send{

width:55px;

border-radius:50%;

border:none;

background:#00e5ff;

}




@media(max-width:700px){


.sidebar{

display:none;

}


h1{

font-size:34px;

}



.eye{

width:190px;

height:110px;

}


.pupil{

left:65px;

top:25px;

}


}

</style>

</head>



<body>


<div class="app">


<aside class="sidebar">


<div class="logo">

Humooe <span>AI</span>

</div>



<button class="menu">
🏠 Главная
</button>


<button class="menu">
💬 Чат
</button>


<button class="menu">
👤 Профиль
</button>



</aside>



<div class="main">


<header>

<h2>
Vision Mode
</h2>


<div class="avatar">
👤
</div>


</header>




<section class="center">


<div class="ring"></div>


<div class="eye">

<div class="pupil"></div>

</div>



<h1>
Humooe AI
</h1>


<p>
Ваш цифровой интеллект
</p>



<button class="start">

Начать разговор

</button>



</section>




<section class="chat">


<div class="messages">


<div class="message ai">

👁️ Система активирована

</div>


</div>



<div class="input">

<input placeholder="Сообщение">


<button class="send">

➤

</button>


</div>


</section>



</div>


</div>




<script>


const start =
document.querySelector(".start");


const center =
document.querySelector(".center");


const chat =
document.querySelector(".chat");



start.onclick=()=>{

center.style.display="none";

chat.style.display="flex";

};




const send =
document.querySelector(".send");

const input =
document.querySelector(".input input");

const messages =
document.querySelector(".messages");



send.onclick=()=>{


if(!input.value)return;


messages.innerHTML+=`

<div class="message user">
${input.value}
</div>

`;


input.value="";


setTimeout(()=>{


messages.innerHTML+=`

<div class="message ai">
👁️ Humooe анализирует запрос...
</div>

`;


},700);


};


</script>



</body>

</html>
