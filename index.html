<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humooe AI</title>

<style>

*{
box-sizing:border-box;
font-family:
Inter,
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
}


body{

margin:0;
height:100vh;
background:#050505;
color:white;
overflow:hidden;

}


body:before{

content:"";
position:fixed;
width:500px;
height:500px;
background:radial-gradient(circle,#673ab7,transparent 70%);
top:-200px;
right:-200px;
filter:blur(80px);
animation:moveGlow 10s infinite alternate;

}


@keyframes moveGlow{

from{
transform:translate(0,0);
}

to{
transform:translate(-100px,150px);
}

}



.app{

height:100vh;
display:flex;
flex-direction:column;

}



.header{

height:80px;
padding:20px;
display:flex;
align-items:center;
justify-content:space-between;

}



.logo{

font-size:26px;
font-weight:800;

}


.logo span{

color:#8b5cf6;

}



.avatar{

width:45px;
height:45px;
border-radius:50%;
background:#ffffff15;
border:1px solid #ffffff20;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;

}


.avatar:hover{

transform:scale(1.1);

}





.page{

flex:1;
padding:20px;
overflow:auto;

}



.hero{

animation:show .6s;

}



@keyframes show{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;

}

}



.hero h1{

font-size:42px;
line-height:1.1;
margin:20px 0 10px;

}



.hero p{

color:#999;
font-size:17px;

}




.ai-core{

width:150px;
height:150px;
margin:40px auto;
border-radius:50%;

background:

radial-gradient(circle,
white,
#8b5cf6,
#111);

display:flex;
align-items:center;
justify-content:center;

font-size:50px;

animation:pulse 3s infinite;

}



@keyframes pulse{

0%,100%{

transform:scale(1);

box-shadow:
0 0 20px #8b5cf6;

}


50%{

transform:scale(1.08);

box-shadow:
0 0 70px #8b5cf6;

}

}




.card{

background:#ffffff10;
border:1px solid #ffffff20;
backdrop-filter:blur(20px);

border-radius:30px;

padding:20px;

margin-bottom:20px;

}



.primary{

width:100%;
height:55px;

border:none;
border-radius:30px;

background:white;
color:black;

font-size:17px;

cursor:pointer;

transition:.3s;

}



.primary:active{

transform:scale(.95);

}




.bottom{

height:75px;

background:#0b0b0bdd;

border-top:1px solid #ffffff15;

display:flex;
justify-content:space-around;
align-items:center;

}



.nav{

color:#999;
font-size:13px;
text-align:center;
cursor:pointer;

}



.nav b{

display:block;
font-size:24px;

}



.nav.active{

color:white;

}




.chat{

display:none;
height:100%;
flex-direction:column;

}



.messages{

flex:1;
overflow:auto;

}



.message{

padding:15px;
border-radius:22px;
margin-bottom:15px;
max-width:85%;

animation:show .3s;

}



.ai{

background:#ffffff12;

}



.user{

background:white;
color:black;
margin-left:auto;

}



.input-box{

display:flex;
gap:10px;

}



.input-box input{

flex:1;
height:55px;

border-radius:30px;

background:#ffffff10;
border:1px solid #ffffff20;

color:white;

padding:0 20px;

font-size:16px;

}



.send{

width:55px;
height:55px;
border-radius:50%;
border:none;

}



</style>
<!-- ПРОФИЛЬ -->

<div class="modal" id="profileModal">

<div class="window">

<h2>👤 Профиль</h2>

<p id="profileText">
Вы не вошли
</p>


<button class="primary" onclick="openLogin()">
Войти
</button>


<button class="primary" onclick="openRegister()">
Регистрация
</button>


<button 
id="logoutButton"
class="primary"
onclick="logout()"
style="display:none">

Выйти

</button>


<button class="primary" onclick="closeProfile()">
Закрыть
</button>


</div>

</div>





<!-- ВХОД / РЕГИСТРАЦИЯ -->

<div class="modal" id="authModal">

<div class="window">


<h2 id="authTitle">
Вход
</h2>


<input 
id="email"
class="authInput"
placeholder="Email">


<input 
id="password"
class="authInput"
type="password"
placeholder="Пароль">


<button 
class="primary"
onclick="authAction()"
id="authBtn">

Войти

</button>


<button 
class="primary"
onclick="closeAuth()">

Закрыть

</button>


</div>

</div>






<style>


.modal{

position:fixed;
inset:0;

background:#000b;

display:none;

align-items:flex-end;

z-index:20;

}



.window{

width:100%;

background:#111;

border-radius:35px 35px 0 0;

padding:30px;

animation:up .4s;

}



@keyframes up{

from{

transform:translateY(100%);

}

to{

transform:none;

}

}



.authInput{

width:100%;

height:55px;

margin:10px 0;

border-radius:25px;

background:#050505;

border:1px solid #333;

color:white;

padding:0 20px;

font-size:16px;

}




.copy{

margin-top:10px;

background:#ffffff15;

border:1px solid #ffffff20;

color:white;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

font-size:14px;

}



.toast{

position:fixed;

bottom:100px;

left:50%;

transform:translateX(-50%);

background:white;

color:black;

padding:12px 25px;

border-radius:30px;

display:none;

}



</style>






<div class="toast" id="toast">

✓ Скопировано

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


// =======================
// SUPABASE
// =======================


const SUPABASE_URL =
"https://https://reaajdispyhngnqdjsio.supabase.co";


const SUPABASE_KEY =
"sb_publishable_1UwuGu3Ni-BHNhfzmHTkVQ_iY_NPqMM";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





let authMode="login";





// =======================
// PROFILE
// =======================


function openProfile(){

profileModal.style.display="flex";

checkUser();

}



function closeProfile(){

profileModal.style.display="none";

}




async function checkUser(){


const {

data:{user}

}=await supabaseClient.auth.getUser();



if(user){

profileText.innerHTML=
"👤 "+user.email;


logoutButton.style.display="block";


}else{


profileText.innerHTML=
"Вы не вошли";


logoutButton.style.display="none";


}



}





// =======================
// AUTH
// =======================


function openLogin(){

authMode="login";

authTitle.innerHTML="Вход";

authBtn.innerHTML="Войти";


closeProfile();

authModal.style.display="flex";

}



function openRegister(){

authMode="register";

authTitle.innerHTML="Регистрация";

authBtn.innerHTML="Создать аккаунт";


closeProfile();

authModal.style.display="flex";

}




function closeAuth(){

authModal.style.display="none";

}






async function authAction(){



let mail=email.value;

let pass=password.value;



if(authMode==="register"){


const {

error

}=await supabaseClient.auth.signUp({

email:mail,

password:pass

});



if(error)

alert(error.message);

else

alert("Аккаунт создан");


}





else{


const {

error

}=await supabaseClient.auth.signInWithPassword({

email:mail,

password:pass

});



if(error)

alert(error.message);

else

alert("Вы вошли");


}



closeAuth();

checkUser();


}






async function logout(){

await supabaseClient.auth.signOut();

checkUser();

}







// =======================
// CHAT
// =======================



function addAI(text){


let box=document.createElement("div");


box.className="message ai";


box.innerHTML=

text+

"<br><button class='copy' onclick='copyText(this)'>📋 Копировать</button>";



messages.appendChild(box);


}



function addUser(text){


let box=document.createElement("div");


box.className="message user";


box.innerHTML=text;


messages.appendChild(box);


}







async function sendMessage(){



let text=input.value.trim();



if(!text)return;



addUser(text);


input.value="";




// ТУТ ПОТОМ ПОДКЛЮЧИМ CLOUDFLARE WORKER


let answer=

"🤖 Humooe AI думает...\n\n"+
"Ответ для: "+text;



setTimeout(()=>{


addAI(answer);


},800);



}







// =======================
// COPY
// =======================



function copyText(btn){



let text=

btn.parentElement.innerText
.replace("📋 Копировать","");



navigator.clipboard.writeText(text);



toast.style.display="block";


setTimeout(()=>{


toast.style.display="none";


},1500);



}






</script>


</body>
</html>
